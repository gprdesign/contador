<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }

    #contador {
      width: 100vw;
      height: 100vh;
      max-width: 375px;
      max-height: 210px;
      margin: 0 auto;
      background: #fff;
      color: #111;
      display: flex;
      flex-direction: column;
      padding: 10px 15px;
      position: relative;
      overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
      justify-content: space-between;
    }

    #contador::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(255,80,80,0.4) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      z-index: 0;
    }

    #contador.running { color: #fff; animation: bgRedPulse 2s ease-in-out infinite alternate; }
    #contador.running::before { opacity: 1; animation: blurPulse 2s ease-in-out infinite alternate; }
    #contador.overtime { color: #fff; animation: bgOvertimePulse 1.2s ease-in-out infinite alternate; }
    #contador.overtime::before { opacity: 1; animation: blurOvertimePulse 1.2s ease-in-out infinite alternate; }

    @keyframes bgRedPulse      { 0%{background:#7a0000} 100%{background:#b00000} }
    @keyframes blurPulse       { 0%{opacity:0.4} 100%{opacity:0.85} }
    @keyframes bgOvertimePulse { 0%{background:#aa0000} 100%{background:#e00000} }
    @keyframes blurOvertimePulse { 0%{opacity:0.6} 100%{opacity:1} }

    /* RELÓGIO */
    .clock-block {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      position: relative;
      z-index: 1;
      height: 38px;
    }

    #lineNow {
      font-size: 2.2rem;
      font-weight: 800;
      color: inherit;
      line-height: 1;
      letter-spacing: -1px;
    }

    .clock-date-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
    }

    #lineWeekday, #lineDate {
      font-weight: 700;
      font-size: 0.75rem;
      line-height: 1.1;
      white-space: nowrap;
    }

    #lineWeekday { color: #444; text-transform: capitalize; }
    #lineDate { color: #888; }
    #contador.running #lineWeekday, #contador.overtime #lineWeekday { color: rgba(255,255,255,0.85); }
    #contador.running #lineDate, #contador.overtime #lineDate { color: rgba(255,255,255,0.65); }

    /* INPUTS */
    .input-row {
      display: flex;
      gap: 6px;
      position: relative;
      z-index: 1;
      height: 28px;
    }
    .input-row input {
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      color: #111;
      font-size: 0.8rem;
      padding: 0 6px;
    }
    #taskName { flex: 2; }
    #targetTime { flex: 1.2; }
    #contador.running input, #contador.overtime input {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }

    /* BOTÃO */
    .btn-row { position: relative; z-index: 1; height: 32px; }
    .btn-row button {
      width: 100%;
      height: 100%;
      font-size: 0.85rem;
      border-radius: 4px;
      font-weight: 800;
      cursor: pointer;
      border: none;
    }
    .btn-start { background: #c0392b; color: white; }
    .btn-done { background: #0984e3; color: white; display: none; }

    /* TIMER */
    .timer-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    #timer {
      font-size: 1.8rem;
      font-weight: bold;
      line-height: 1;
      letter-spacing: 1px;
    }
    .progress-container {
      width: 100%;
      height: 3px;
      background: rgba(0,0,0,0.1);
      border-radius: 2px;
      margin-top: 2px;
      overflow: hidden;
    }
    #contador.running .progress-container, #contador.overtime .progress-container { background: rgba(255,255,255,0.2); }
    .progress-bar { height: 100%; width: 0%; background: #e55; transition: width 1s linear; }

    #alarmMessage {
      font-size: 0.8rem;
      font-weight: bold;
      color: #ffeaa7;
      display: none;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div id="contador">
    <div class="clock-block">
      <div id="lineNow">--:--</div>
      <div class="clock-date-col">
        <div id="lineWeekday">...</div>
        <div id="lineDate">...</div>
      </div>
    </div>

    <div class="input-row">
      <input type="text" id="taskName" placeholder="Tarefa">
      <input type="time" id="targetTime">
    </div>

    <div class="btn-row">
      <button id="btnStart" class="btn-start" onclick="startTimer()">INICIAR</button>
      <button id="btnDone"  class="btn-done"  onclick="finishTask()">CONCLUIR</button>
    </div>

    <div class="timer-row">
      <div id="timer">00:00:00</div>
      <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>
      <div id="alarmMessage">⏰ TEMPO ESGOTADO!</div>
    </div>
  </div>

  <audio id="alarmSound" src="https://www.soundjay.com/buttons/sounds/button-35.mp3" onended="checkRepeat()"></audio>

  <script>
    const timerEl = document.getElementById("timer"), progressBar = document.getElementById("progressBar"), targetInput = document.getElementById("targetTime"), taskInput = document.getElementById("taskName"), btnStart = document.getElementById("btnStart"), btnDone = document.getElementById("btnDone"), contEl = document.getElementById("contador");
    let interval, targetDate, startMoment, totalDuration, playCount = 0;

    function updateClock() {
      const now = new Date();
      document.getElementById("lineNow").textContent = now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
      const weekday = now.toLocaleDateString('pt-BR', {weekday: 'long'});
      document.getElementById("lineWeekday").textContent = weekday.charAt(0).toUpperCase() + weekday.slice(1);
      const day = String(now.getDate()).padStart(2, '0'), month = String(now.getMonth() + 1).padStart(2, '0'), monthShort = now.toLocaleDateString('pt-BR', {month: 'short'}).replace('.','');
      document.getElementById("lineDate").textContent = day + '/' + month + ' (' + monthShort.charAt(0).toUpperCase() + monthShort.slice(1) + '.)';
    }
    setInterval(updateClock, 1000); updateClock();

    function startTimer() {
      const input = targetInput.value; if (!input) return;
      const now = new Date(), [h, m] = input.split(":").map(Number);
      targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
      if (targetDate <= now) targetDate.setDate(targetDate.getDate() + 1);
      startMoment = new Date(); totalDuration = targetDate - startMoment;
      btnStart.style.display = "none"; btnDone.style.display = "block";
      contEl.classList.add("running"); interval = setInterval(tick, 1000);
    }

    function tick() {
      const now = new Date(), diff = targetDate - now;
      if (diff <= 0) {
        clearInterval(interval); timerEl.textContent = "00:00:00";
        document.getElementById("alarmMessage").style.display = "block";
        contEl.classList.replace("running", "overtime"); playCount = 0; playAlarm(); return;
      }
      const hh = String(Math.floor(diff / 3600000)).padStart(2, '0'), mm = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0'), ss = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
      timerEl.textContent = hh + ":" + mm + ":" + ss;
      progressBar.style.width = Math.min(100, ((now - startMoment) / totalDuration) * 100) + "%";
    }

    function finishTask() { clearInterval(interval); resetTimer(); }
    function resetTimer() {
      clearInterval(interval); const sound = document.getElementById("alarmSound"); sound.pause(); sound.currentTime = 0;
      timerEl.textContent = "00:00:00"; progressBar.style.width = "0%";
      btnStart.style.display = "block"; btnDone.style.display = "none";
      document.getElementById("alarmMessage").style.display = "none";
      contEl.classList.remove("running", "overtime");
    }
    function playAlarm() { if (playCount < 3) document.getElementById("alarmSound").play().catch(() => {}); }
    function checkRepeat() { playCount++; if (playCount < 3) setTimeout(() => { document.getElementById("alarmSound").currentTime = 0; playAlarm(); }, 200); }
  </script>
</body>
</html>
