<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #contador {
      width: 320px;
      height: 165px;
      min-width: 320px;
      min-height: 165px;
      max-width: 320px;
      max-height: 165px;
      background: #fff;
      color: #111;
      display: flex;
      flex-direction: column;
      padding: 6px 10px;
      position: relative;
      overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
      justify-content: space-between;
      border-radius: 0;
      box-shadow: none;
      box-sizing: border-box;
    }

    #contador::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 0px solid transparent;
      transition: border 0.4s ease;
      pointer-events: none;
      z-index: 2;
    }

    #contador.running { color: #fff; background: #111; }
    #contador.running::after {
      border: 3px solid rgba(255, 255, 0, 0.5);
      box-shadow: inset 0 0 12px rgba(255, 255, 0, 0.3);
      animation: blurPulse 1s ease-in-out infinite alternate;
    }

    #contador.overtime { color: #fff; background: #b00000; }
    #contador.overtime::after {
      border: 4px solid rgba(255, 255, 255, 0.6);
      box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.4);
      animation: blurOvertimePulse 0.5s ease-in-out infinite alternate;
    }

    @keyframes blurPulse {
      0% { box-shadow: inset 0 0 5px rgba(255, 255, 0, 0.2); border-color: rgba(255, 255, 0, 0.3); }
      100% { box-shadow: inset 0 0 15px rgba(255, 255, 0, 0.6); border-color: rgba(255, 255, 0, 0.8); }
    }
    @keyframes blurOvertimePulse {
      0% { box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.4); }
      100% { box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.8); border-color: rgba(255, 255, 255, 0.9); }
    }

    .header-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
      height: 28px;
      gap: 6px;
    }

    .clock-block {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 5px;
    }

    #lineNow {
      font-size: 1.4rem;
      font-weight: 800;
      color: inherit;
      line-height: 1;
      letter-spacing: -1px;
    }

    .clock-date-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #lineWeekday, #lineDate {
      font-weight: 700;
      font-size: 0.6rem;
      line-height: 1.1;
      white-space: nowrap;
    }

    #lineWeekday { color: #444; text-transform: capitalize; }
    #lineDate { color: #888; }
    #contador.running #lineWeekday, #contador.overtime #lineWeekday { color: rgba(255,255,255,0.85); }
    #contador.running #lineDate, #contador.overtime #lineDate { color: rgba(255,255,255,0.65); }

    .btn-container { width: 70px; height: 24px; }
    .btn-container button {
      width: 100%;
      height: 100%;
      font-size: 0.65rem;
      border-radius: 4px;
      font-weight: 800;
      cursor: pointer;
      border: none;
    }
    .btn-start { background: #c0392b; color: white; }
    .btn-done { background: #0984e3; color: white; display: none; }

    .timer-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      flex: 1;
    }
    #timer {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.5px;
    }
    .progress-container {
      width: 75%;
      height: 3px;
      background: rgba(0,0,0,0.1);
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }
    #contador.running .progress-container { background: rgba(255,255,255,0.2); }
    .progress-bar { height: 100%; width: 0%; background: #ccff00; box-shadow: 0 0 6px #ccff00; transition: width 0.5s ease; }

    #alarmMessage {
      font-size: 0.7rem;
      font-weight: 900;
      color: #ffeaa7;
      display: none;
      margin-top: 2px;
    }

    .input-row {
      display: flex;
      gap: 3px;
      position: relative;
      z-index: 1;
      height: 22px;
    }
    .input-row input {
      border-radius: 3px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      color: #111;
      font-size: 0.65rem;
      padding: 0 5px;
    }
    #taskName { flex: 2; }
    #targetTime { width: 65px; }
    #contador.running input, #contador.overtime input {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="contador">
    <div class="header-row">
      <div class="clock-block">
        <div id="lineNow">--:--</div>
        <div class="clock-date-col">
          <div id="lineWeekday">...</div>
          <div id="lineDate">...</div>
        </div>
      </div>
      <div class="btn-container">
        <button id="btnStart" class="btn-start" onclick="startTimer()">INICIAR</button>
        <button id="btnDone"  class="btn-done"  onclick="finishTask()">CONCLUIR</button>
      </div>
    </div>

    <div class="timer-row">
      <div id="timer">00:00:00</div>
      <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>
      <div id="alarmMessage">⏰ ESGOTADO!</div>
    </div>

    <div class="input-row">
      <input type="text" id="taskName" placeholder="Tarefa">
      <input type="time" id="targetTime">
    </div>
  </div>

  <audio id="alarmSound" src="https://www.soundjay.com/buttons/sounds/button-35.mp3" onended="checkRepeat()"></audio>

  <script>
    const timerEl = document.getElementById("timer"), progressBar = document.getElementById("progressBar"), targetInput = document.getElementById("targetTime"), taskInput = document.getElementById("taskName"), btnStart = document.getElementById("btnStart"), btnDone = document.getElementById("btnDone"), contEl = document.getElementById("contador");
    let interval, targetDate, playCount = 0;

    function updateClock() {
      const now = new Date();
      document.getElementById("lineNow").textContent = now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
      const weekday = now.toLocaleDateString('pt-BR', {weekday: 'long'});
      document.getElementById("lineWeekday").textContent = weekday.charAt(0).toUpperCase() + weekday.slice(1);
      const day = String(now.getDate()).padStart(2, '0'), month = String(now.getMonth() + 1).padStart(2, '0'), monthShort = now.toLocaleDateString('pt-BR', {month: 'short'}).replace('.','');
      document.getElementById("lineDate").textContent = day + '/' + month + ' (' + monthShort.charAt(0).toUpperCase() + monthShort.slice(1) + '.)';
    }
    setInterval(updateClock, 1000); updateClock();

    function startTimer() {
      const input = targetInput.value; if (!input) return;
      const now = new Date(), [h, m] = input.split(":").map(Number);
      targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
      if (targetDate <= now) targetDate.setDate(targetDate.getDate() + 1);
      btnStart.style.display = "none"; btnDone.style.display = "block";
      contEl.classList.add("running"); interval = setInterval(tick, 1000); tick();
    }

    function tick() {
      const now = new Date(), diff = targetDate - now;
      const startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 9, 0, 0);
      if (startTime > targetDate) startTime.setDate(startTime.getDate() - 1);
      const totalRange = targetDate - startTime;
      const currentProgress = now - startTime;
      const progressPercent = Math.max(0, Math.min(100, (currentProgress / totalRange) * 100));
      progressBar.style.width = progressPercent + "%";

      if (diff <= 0) {
        clearInterval(interval); timerEl.textContent = "00:00:00";
        document.getElementById("alarmMessage").style.display = "block";
        contEl.classList.replace("running", "overtime"); playCount = 0; playAlarm(); return;
      }
      const hh = String(Math.floor(diff / 3600000)).padStart(2, '0'), mm = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0'), ss = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
      timerEl.textContent = hh + ":" + mm + ":" + ss;
    }

    function finishTask() { clearInterval(interval); resetTimer(); }
    function resetTimer() {
      clearInterval(interval); const sound = document.getElementById("alarmSound"); sound.pause(); sound.currentTime = 0;
      timerEl.textContent = "00:00:00"; progressBar.style.width = "0%";
      btnStart.style.display = "block"; btnDone.style.display = "none";
      document.getElementById("alarmMessage").style.display = "none";
      contEl.classList.remove("running", "overtime");
    }
    function playAlarm() { if (playCount < 3) document.getElementById("alarmSound").play().catch(() => {}); }
    function checkRepeat() { playCount++; if (playCount < 3) setTimeout(() => { document.getElementById("alarmSound").currentTime = 0; playAlarm(); }, 200); }
  </script>
</body>
</html>
