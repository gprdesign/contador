<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
    }

    /* ===================== CONTADOR ===================== */
    #contador {
      width: clamp(280px, 90vw, 520px);
      background: #fff;
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.5vh, 20px);
      padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 36px);
      position: relative;
      overflow: hidden;
      border-radius: clamp(12px, 2vw, 20px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      transition: background 0.4s ease, color 0.4s ease;
    }

    #contador::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(255,80,80,0.4) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      z-index: 0;
    }

    #contador.running {
      color: #fff;
      animation: bgRedPulse 2s ease-in-out infinite alternate;
    }
    #contador.running::before {
      opacity: 1;
      animation: blurPulse 2s ease-in-out infinite alternate;
    }
    #contador.overtime {
      color: #fff;
      animation: bgOvertimePulse 1.2s ease-in-out infinite alternate;
    }
    #contador.overtime::before {
      opacity: 1;
      animation: blurOvertimePulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes bgRedPulse      { 0%{background:#7a0000} 100%{background:#b00000} }
    @keyframes blurPulse       { 0%{opacity:0.4} 100%{opacity:0.85} }
    @keyframes bgOvertimePulse { 0%{background:#aa0000} 100%{background:#e00000} }
    @keyframes blurOvertimePulse { 0%{opacity:0.6} 100%{opacity:1} }

    /* ===================== RELÓGIO GRANDE ===================== */
    .clock-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4px, 1vh, 10px);
      position: relative;
      z-index: 1;
      width: 100%;
    }

    /* HORA */
    #lineNow {
      font-size: clamp(3.5rem, 14vw, 7rem);
      font-weight: 800;
      color: inherit;
      line-height: 1;
      letter-spacing: -2px;
      text-align: center;
    }

    /* DIA DA SEMANA */
    #lineWeekday {
      font-size: clamp(1.1rem, 4vw, 2.2rem);
      font-weight: 700;
      color: #555;
      text-align: center;
      line-height: 1;
      text-transform: capitalize;
    }
    #contador.running #lineWeekday,
    #contador.overtime #lineWeekday { color: rgba(255,255,255,0.8); }

    /* DATA */
    #lineDate {
      font-size: clamp(0.95rem, 3.2vw, 1.8rem);
      font-weight: 600;
      color: #888;
      text-align: center;
      line-height: 1;
    }
    #contador.running #lineDate,
    #contador.overtime #lineDate { color: rgba(255,255,255,0.65); }

    /* Divisor */
    .clock-divider {
      width: 100%;
      height: 1px;
      background: rgba(0,0,0,0.07);
      position: relative;
      z-index: 1;
    }
    #contador.running .clock-divider,
    #contador.overtime .clock-divider { background: rgba(255,255,255,0.18); }

    /* ===================== INPUTS ===================== */
    .input-row {
      display: flex;
      gap: clamp(6px, 1.5vw, 12px);
      width: 100%;
      min-width: 0;
      position: relative;
      z-index: 1;
    }
    .input-row input[type="text"] {
      flex: 1 1 60%;
      min-width: 0;
      font-size: clamp(0.78rem, 2vw, 0.95rem);
      padding: clamp(7px, 1.5vh, 12px) clamp(8px, 1.5vw, 14px);
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      color: #111;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .input-row input[type="text"]::placeholder { color: #999; }
    .input-row input[type="text"]:focus { border-color: #c0392b; outline: none; }
    #contador.running .input-row input[type="text"],
    #contador.overtime .input-row input[type="text"] {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }
    #contador.running .input-row input[type="text"]::placeholder,
    #contador.overtime .input-row input[type="text"]::placeholder { color: rgba(255,255,255,0.5); }

    .input-row input[type="time"] {
      flex: 1 1 35%;
      min-width: 0;
      font-size: clamp(0.78rem, 2vw, 0.95rem);
      padding: clamp(7px, 1.5vh, 12px) clamp(8px, 1.5vw, 14px);
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      color: #111;
    }
    .input-row input[type="time"]:focus { border-color: #c0392b; outline: none; }
    #contador.running .input-row input[type="time"],
    #contador.overtime .input-row input[type="time"] {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }

    /* ===================== BOTÕES ===================== */
    .btn-row {
      display: flex;
      gap: clamp(6px, 1.5vw, 12px);
      width: 100%;
      min-width: 0;
      position: relative;
      z-index: 1;
    }
    .btn-row button {
      flex: 1 1 0;
      min-width: 0;
      font-size: clamp(0.78rem, 2vw, 0.92rem);
      padding: clamp(8px, 2vh, 14px) 4px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .btn-start { background: #c0392b; color: white; }
    .btn-start:hover { background: #e74c3c; }
    .btn-done  { background: #0984e3; color: white; display: none; }
    .btn-done:hover  { background: #74b9ff; }
    .btn-reset { background: #e0e0e0; color: #333; }
    .btn-reset:hover { background: #ccc; }

    /* ===================== TIMER ===================== */
    .timer-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 1.5vh, 12px);
      width: 100%;
      position: relative;
      z-index: 1;
    }
    #timer {
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: bold;
      color: inherit;
      letter-spacing: clamp(2px, 0.5vw, 5px);
      transition: color 0.3s;
      text-align: center;
    }
    .timer-running  { animation: glowRed 2s ease-in-out infinite alternate; }
    .timer-overtime { color: #ff7675 !important; animation: glowOvertimeRed 1.2s ease-in-out infinite alternate; }

    @keyframes glowRed {
      0%   { text-shadow: 0 0 4px rgba(255,80,80,0.2); }
      100% { text-shadow: 0 0 16px rgba(255,80,80,0.7), 0 0 28px rgba(255,80,80,0.3); }
    }
    @keyframes glowOvertimeRed {
      0%   { text-shadow: 0 0 6px rgba(255,50,50,0.4); }
      100% { text-shadow: 0 0 24px rgba(255,50,50,1), 0 0 40px rgba(255,50,50,0.5); }
    }

    .progress-container {
      width: 100%;
      height: clamp(4px, 1vh, 8px);
      background: rgba(0,0,0,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    #contador.running .progress-container,
    #contador.overtime .progress-container { background: rgba(255,255,255,0.2); }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #e55;
      transition: width 1s linear;
    }

    #alarmMessage {
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      font-weight: bold;
      color: #ffeaa7;
      display: none;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    /* ===================== RESPONSIVO — TELA PEQUENA (≤400px) ===================== */
    @media (max-width: 400px) {
      #lineNow { font-size: clamp(3rem, 18vw, 4.5rem); }
      #lineWeekday { font-size: clamp(0.95rem, 5vw, 1.4rem); }
      #lineDate { font-size: clamp(0.8rem, 4vw, 1.1rem); }
    }

    /* ===================== MODO JANELA PEQUENA 365×205 ===================== */
    /* Ativa quando a janela for pequena e baixa — todo conteúdo precisa caber em ~205px de altura */
    @media (max-height: 260px) {

      html, body {
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }

      #contador {
        /* Ocupa toda a janela */
        width: 100vw;
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;

        /* Layout: coluna compactíssima — tudo espremido verticalmente */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 4px 10px;
      }

      /* ---- RELÓGIO: hora grande + dia/data em linha ---- */
      .clock-block {
        flex-direction: row;
        align-items: baseline;
        justify-content: center;
        gap: 6px;
        width: 100%;
        flex-wrap: nowrap;
      }

      #lineNow {
        font-size: 1.9rem;
        letter-spacing: -1px;
        line-height: 1;
        flex-shrink: 0;
      }

      #lineWeekday {
        font-size: 0.65rem;
        line-height: 1.1;
        white-space: nowrap;
      }

      #lineDate {
        font-size: 0.58rem;
        line-height: 1.1;
        white-space: nowrap;
      }

      /* ---- DIVISOR: mais fino ---- */
      .clock-divider {
        height: 1px;
        width: 90%;
        margin: 1px 0;
      }

      /* ---- INPUTS: em linha, bem compactos ---- */
      .input-row {
        gap: 4px;
        flex-direction: row;
      }

      .input-row input[type="text"] {
        font-size: 0.7rem;
        padding: 3px 6px;
        border-radius: 5px;
        flex: 1 1 58%;
      }

      .input-row input[type="time"] {
        font-size: 0.7rem;
        padding: 3px 4px;
        border-radius: 5px;
        flex: 1 1 36%;
      }

      /* ---- BOTÕES: em linha, mini ---- */
      .btn-row {
        gap: 4px;
      }

      .btn-row button {
        font-size: 0.65rem;
        padding: 3px 4px;
        border-radius: 5px;
      }

      /* ---- TIMER: menor, sem margin extra ---- */
      .timer-row {
        gap: 2px;
      }

      #timer {
        font-size: 1.5rem;
        letter-spacing: 1px;
      }

      .progress-container {
        height: 3px;
      }

      #alarmMessage {
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>

  <div id="contador">

    <!-- RELÓGIO GRANDE -->
    <div class="clock-block">
      <div id="lineNow">--:--</div>
      <div id="lineWeekday">...</div>
      <div id="lineDate">...</div>
    </div>

    <div class="clock-divider"></div>

    <!-- INPUTS -->
    <div class="input-row">
      <input type="text" id="taskName" placeholder="Tarefa / etapa">
      <input type="time" id="targetTime">
    </div>

    <!-- BOTÕES -->
    <div class="btn-row">
      <button id="btnStart" class="btn-start" onclick="startTimer()">INICIAR</button>
      <button id="btnDone"  class="btn-done"  onclick="finishTask()">CONCLUIR</button>
      <button class="btn-reset" onclick="resetTimer()">RESETAR</button>
    </div>

    <!-- TIMER -->
    <div class="timer-row">
      <div id="timer">00:00:00</div>
      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="alarmMessage">⏰ TEMPO ESGOTADO!</div>
    </div>

  </div>

  <audio id="alarmSound" src="https://www.soundjay.com/buttons/sounds/button-35.mp3" onended="checkRepeat()"></audio>

  <script>
    const timerEl     = document.getElementById("timer");
    const progressBar = document.getElementById("progressBar");
    const targetInput = document.getElementById("targetTime");
    const taskInput   = document.getElementById("taskName");
    const btnStart    = document.getElementById("btnStart");
    const btnDone     = document.getElementById("btnDone");
    const contEl      = document.getElementById("contador");

    let interval, targetDate, startMoment, totalDuration;
    let playCount = 0;

    function updateClock() {
      const now = new Date();
      // HORA
      document.getElementById("lineNow").textContent =
        now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
      // DIA DA SEMANA
      const weekday = now.toLocaleDateString('pt-BR', {weekday: 'long'});
      document.getElementById("lineWeekday").textContent =
        weekday.charAt(0).toUpperCase() + weekday.slice(1);
      // DATA
      const day   = now.toLocaleDateString('pt-BR', {day: '2-digit'});
      const month = now.toLocaleDateString('pt-BR', {month: 'long'});
      const year  = now.getFullYear();
      document.getElementById("lineDate").textContent =
        day + ' de ' + month.charAt(0).toUpperCase() + month.slice(1) + ' de ' + year;
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.getElementById("targetTime").addEventListener("keydown", function(e) {
      if (e.key === "Enter") startTimer();
    });

    function startTimer() {
      const input = targetInput.value;
      if (!input) return alert("Defina a hora alvo!");
      const now = new Date();
      const [h, m] = input.split(":").map(Number);
      targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
      if (targetDate <= now) targetDate.setDate(targetDate.getDate() + 1);
      startMoment   = new Date();
      totalDuration = targetDate - startMoment;
      btnStart.style.display = "none";
      btnDone.style.display  = "block";
      timerEl.className      = "timer-running";
      contEl.classList.add("running");
      contEl.classList.remove("overtime");
      interval = setInterval(tick, 1000);
    }

    function tick() {
      const now  = new Date();
      const diff = targetDate - now;
      if (diff <= 0) {
        clearInterval(interval);
        timerEl.textContent = "00:00:00";
        timerEl.className   = "timer-overtime";
        progressBar.style.width = "100%";
        document.getElementById("alarmMessage").style.display = "block";
        contEl.classList.remove("running");
        contEl.classList.add("overtime");
        playCount = 0;
        playAlarm();
        return;
      }
      const hh = String(Math.floor(diff / 3600000)).padStart(2, '0');
      const mm = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
      const ss = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
      timerEl.textContent = hh + ":" + mm + ":" + ss;
      const progress = ((now - startMoment) / totalDuration) * 100;
      progressBar.style.width = Math.min(100, progress) + "%";
    }

    function finishTask() {
      clearInterval(interval);
      const history = JSON.parse(localStorage.getItem('contador_tasks') || '[]');
      history.push({ name: taskInput.value || "Tarefa", time: new Date().toLocaleTimeString() });
      localStorage.setItem('contador_tasks', JSON.stringify(history));
      resetTimer();
    }

    function resetTimer() {
      clearInterval(interval);
      playCount = 3;
      const sound = document.getElementById("alarmSound");
      sound.pause();
      sound.currentTime = 0;
      timerEl.textContent = "00:00:00";
      timerEl.className   = "";
      progressBar.style.width = "0%";
      btnStart.style.display = "block";
      btnDone.style.display  = "none";
      document.getElementById("alarmMessage").style.display = "none";
      contEl.classList.remove("running", "overtime");
    }

    function playAlarm() {
      if (playCount < 3) {
        document.getElementById("alarmSound").play().catch(function(e) {});
      }
    }

    function checkRepeat() {
      playCount++;
      if (playCount < 3) {
        setTimeout(function() {
          document.getElementById("alarmSound").currentTime = 0;
          playAlarm();
        }, 200);
      }
    }
  </script>
</body>
</html>
