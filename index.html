<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contador</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#0b1120; --panel:rgba(20,30,52,.58); --line:rgba(255,255,255,.11); --muted:#94a3b8; --cyan:#38bdf8; --violet:#818cf8; }
    html,body { width:100%; height:100%; min-height:0; overflow:hidden; background:var(--bg); color:#f8fafc; font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    body { min-height:100dvh; overflow-x:hidden; background:radial-gradient(ellipse at 15% 20%,rgba(56,189,248,.13),transparent 38%),radial-gradient(ellipse at 85% 80%,rgba(129,140,248,.12),transparent 40%),linear-gradient(135deg,#0b1120 0%,#111827 50%,#0b1120 100%); }
    #barra { width:100%; height:100dvh; min-height:0; overflow:hidden; display:grid; grid-template-columns:minmax(210px,.8fr) minmax(390px,1.8fr) minmax(300px,1fr); grid-template-areas:'clock timer controls'; align-items:stretch; gap:clamp(14px,2vw,28px); padding:clamp(16px,3vw,42px); transition:background .3s ease; position:relative; isolation:isolate; }
    #barra::before { content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(120deg,rgba(255,255,255,.025),transparent 45%,rgba(255,255,255,.02)); z-index:-1; }
    .block-clock,.block-timer,.block-controls { background:var(--panel); border:1px solid var(--line); border-radius:24px; backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); box-shadow:0 24px 70px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.05); }
    .block-clock { grid-area:clock; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:18px; padding:clamp(22px,3vw,34px); }
    #lineNow { font-size:clamp(2.2rem,4vw,4.4rem); line-height:.95; font-weight:800; letter-spacing:-.07em; font-variant-numeric:tabular-nums; color:#f8fafc; }
    .clock-meta { display:flex; flex-direction:column; gap:5px; border-left:2px solid var(--cyan); padding-left:14px; line-height:1.2; }
    #lineWeekday { font-size:1rem; font-weight:700; color:#e2e8f0; } #lineDate { font-size:.85rem; color:var(--muted); }
    .block-timer { grid-area:timer; min-width:0; min-height:330px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:clamp(24px,4vw,56px); border-color:rgba(56,189,248,.28); background:linear-gradient(145deg,rgba(56,189,248,.13),rgba(129,140,248,.08) 55%,rgba(20,30,52,.62)); box-shadow:0 30px 90px rgba(56,189,248,.11),inset 0 1px rgba(255,255,255,.1); }
    #timer { width:100%; text-align:center; font-size:clamp(4rem,10vw,10rem); font-weight:900; line-height:.9; letter-spacing:-.025em; font-weight:750; font-variant-numeric:tabular-nums; text-shadow:0 0 18px rgba(56,189,248,.10); white-space:nowrap; }
    .progress-wrap { width:min(100%,520px); height:6px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); margin-top:22px; border-radius:99px; overflow:hidden; box-shadow:inset 0 0 4px rgba(255,255,255,.08); }
    .progress-bar { height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--violet)); box-shadow:0 0 18px rgba(56,189,248,.95); transition:width .5s ease; animation:progressPulse .8s ease-in-out infinite; }
    .block-controls { grid-area:controls; display:flex; flex-direction:column; align-items:stretch; justify-content:center; gap:14px; padding:clamp(22px,3vw,34px); }
    .ctrl-row { display:flex; align-items:center; gap:8px; width:100%; }
    input { width:100%; height:44px; background:rgba(15,23,42,.65); border:1px solid rgba(255,255,255,.12); color:#fff; border-radius:12px; padding:0 12px; outline:none; font:inherit; font-size:.82rem; }
    input:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(56,189,248,.12); } #targetTime { width:116px; flex-shrink:0; text-align:center; }
    button { height:44px; border-radius:12px; border:1px solid transparent; font-weight:800; cursor:pointer; padding:0 16px; font-size:.75rem; white-space:nowrap; transition:transform .2s,filter .2s; }
    button:hover { transform:translateY(-2px); filter:brightness(1.1); } .btn-start { flex:1; background:linear-gradient(135deg,#22c55e,#0ea5a4); color:#fff; } .btn-done { flex:1; background:linear-gradient(135deg,#38bdf8,#6366f1); color:#fff; display:none; } .btn-reset { background:rgba(255,255,255,.1); color:#fff; width:44px; padding:0; flex-shrink:0; border-color:rgba(255,255,255,.12); } .btn-refresh { width:100%; background:rgba(255,255,255,.06); color:#cbd5e1; border-color:rgba(255,255,255,.12); }
    .sep { display:none; } #alarmMsg { font-size:.75rem; font-weight:800; color:#fde68a; display:none; margin-top:12px; }
    #barra.warning .block-timer { border-color:rgba(245,158,11,.7); box-shadow:0 0 70px rgba(245,158,11,.14),inset 0 1px rgba(255,255,255,.1); } #barra.overtime .block-timer { border-color:rgba(239,68,68,.75); box-shadow:0 0 80px rgba(239,68,68,.2),inset 0 1px rgba(255,255,255,.1); animation:blink .5s infinite alternate; } @keyframes blink { from{opacity:1} to{opacity:.82} } @keyframes progressPulse { 0%,100%{opacity:.45;filter:brightness(.85);box-shadow:0 0 8px rgba(56,189,248,.45)} 50%{opacity:1;filter:brightness(1.55);box-shadow:0 0 24px rgba(56,189,248,1),0 0 42px rgba(129,140,248,.65)} }
    @media (max-width:1050px) { #barra { grid-template-columns:1fr 1.4fr; grid-template-areas:'clock clock' 'timer controls'; } .block-clock { min-height:150px; flex-direction:row; align-items:center; justify-content:space-between; } .block-timer { min-height:300px; } #timer { font-size:clamp(4rem,11vw,7rem); } }
    @media (max-width:650px) { #barra { min-height:100dvh; grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr) auto; grid-template-areas:'clock' 'timer' 'controls'; align-content:stretch; gap:12px; --nav-bottom:max(64px,env(safe-area-inset-bottom,0px)); padding:calc(var(--nav-bottom) / 2 - 8px) calc(var(--nav-bottom) / 2) calc(var(--nav-bottom) + 16px); } .block-clock,.block-timer,.block-controls { border-radius:18px; } .block-clock { min-height:86px; padding:20px 22px; flex-direction:row; align-items:center; justify-content:space-between; gap:14px; } #lineNow { font-size:clamp(2.4rem,14vw,3.5rem); } .clock-meta { padding-left:10px; gap:3px; } #lineWeekday { font-size:.86rem; } #lineDate { font-size:.76rem; } .block-timer { min-height:0; padding:24px 12px; } #timer { font-size:clamp(3.8rem,19vw,6rem); } .progress-wrap { margin-top:16px; } .block-controls { min-height:0; padding:16px 20px; gap:10px; } .ctrl-row { gap:10px; } input { height:48px; font-size:.95rem; } button { height:48px; font-size:.8rem; } #targetTime { width:116px; } }
    @media (max-height:650px) and (max-width:650px) {
      #barra { gap:8px; --nav-bottom:max(64px,env(safe-area-inset-bottom,0px)); padding:calc(var(--nav-bottom) / 2 - 8px) calc(var(--nav-bottom) / 2) calc(var(--nav-bottom) + 16px); }
      .block-clock { min-height:68px; padding:12px 16px; }
      #lineNow { font-size:clamp(1.8rem,10vw,2.6rem); }
      #lineWeekday { font-size:.72rem; } #lineDate { font-size:.65rem; }
      .block-timer { padding:18px 10px; }
      #timer { font-size:clamp(2.8rem,16vw,4.4rem); }
      .progress-wrap { margin-top:10px; }
      .block-controls { padding:10px 14px; gap:7px; }
      input,button { height:38px; font-size:.72rem; }
      #targetTime { width:100px; }
    }

    @media (max-height:500px) and (min-width:651px) { #barra { padding:12px 20px; gap:12px; } .block-clock,.block-timer,.block-controls { min-height:0; padding:18px; } #timer { font-size:clamp(3rem,8vw,6rem); } }
  </style>
</head>
<body>

<div id="barra">
  <!-- BLOCO 1 -->
  <div class="block-clock">
    <div id="lineNow">00:00</div>
    <div class="clock-meta">
      <span id="lineWeekday">...</span>
      <span id="lineDate">...</span>
    </div>
  </div>

  <div class="sep"></div>

  <!-- BLOCO 2 -->
  <div class="block-timer">
    <div id="timer">00:00:00</div>
    <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <div id="alarmMsg">⏰ TEMPO ESGOTADO!</div>
  </div>

  <div class="sep"></div>

  <!-- BLOCO 3 -->
  <div class="block-controls">
    <div class="ctrl-row">
      <input type="text" id="taskName" placeholder="O que vem por aí?!">
      <input type="time" id="targetTime">
    </div>
    <div class="ctrl-row">
      <button id="btnStart" class="btn-start" onclick="startTimer()">INICIAR</button>
      <button id="btnDone" class="btn-done" onclick="finishTask()">CONCLUIR</button>
      <button class="btn-reset" onclick="resetTimer()">↺</button>
    </div>
    <button class="btn-refresh" onclick="refreshPage()">↻ ATUALIZAR PÁGINA</button>
  </div>
</div>

<audio id="alarmSound" src="https://www.soundjay.com/buttons/sounds/button-35.mp3"></audio>

<script>
  function updateClock() {
    const now = new Date();
    document.getElementById('lineNow').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const wd = now.toLocaleDateString('pt-BR', { weekday: 'long' });
    document.getElementById('lineWeekday').textContent = wd.charAt(0).toUpperCase() + wd.slice(1);
    const d = String(now.getDate()).padStart(2, '0');
    const m = String(now.getMonth() + 1).padStart(2, '0');
    document.getElementById('lineDate').textContent = d + '/' + m;
  }
  setInterval(updateClock, 1000); updateClock();

  let interval, targetDate;
  const TIMER_STORAGE_KEY = 'contador-active-timer';
  let notificationEnabled = false;
  const NOTIFICATION_TAG = 'contador-ativo';
  let lastNotificationMinute = -1;
  let notificationUpdateInFlight = false;
  const barra = document.getElementById('barra');

  async function requestNotificationPermission() {
    if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
    try {
      const permission = Notification.permission === 'default'
        ? await Notification.requestPermission()
        : Notification.permission;
      notificationEnabled = permission === 'granted';
      if (notificationEnabled) updateAndroidNotification('Contador iniciado', true);
    } catch (error) { notificationEnabled = false; }
  }

  async function updateAndroidNotification(text, force = false) {
    if (!notificationEnabled || !targetDate || notificationUpdateInFlight) return;
    const now = Date.now();
    const currentMinute = Math.floor(now / 60000);
    if (!force && currentMinute === lastNotificationMinute) return;
    notificationUpdateInFlight = true;
    try {
      const registration = await navigator.serviceWorker.ready;
      // Alguns navegadores não substituem corretamente uma notificação com a mesma tag.
      // Fecha apenas a versão anterior para publicar a atualização do minuto.
      const previous = await registration.getNotifications({ tag: NOTIFICATION_TAG });
      previous.forEach((notification) => notification.close());
      await registration.showNotification('⏱️ Contador ativo', {
        body: text,
        tag: NOTIFICATION_TAG,
        renotify: false,
        silent: true,
        requireInteraction: true,
        icon: 'icon.svg',
        badge: 'icon.svg'
      });
      lastNotificationMinute = currentMinute;
    } catch (error) { /* navegador pode bloquear atualizacoes em segundo plano */ }
    finally { notificationUpdateInFlight = false; }
  }

  async function closeAndroidNotification() {
    try {
      if (!('serviceWorker' in navigator)) return;
      const registration = await navigator.serviceWorker.ready;
      const notifications = await registration.getNotifications({ tag: NOTIFICATION_TAG });
      notifications.forEach((notification) => notification.close());
    } catch (error) {}
  }

  function startTimer() {
    const val = document.getElementById('targetTime').value;
    if (!val) return;
    const [h, m] = val.split(':').map(Number);
    const now = new Date();
    targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
    if (targetDate <= now) targetDate.setDate(targetDate.getDate() + 1);

    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('btnDone').style.display = 'block';
    saveTimerState();
    requestNotificationPermission();
    clearInterval(interval);
    interval = setInterval(tick, 1000); tick();
  }

  function tick(playAlarm = true) {
    const now = new Date();
    const diff = targetDate - now;

    // A barra representa o minuto atual: começa no segundo 0 e termina no 59.
    const secondOfMinute = now.getSeconds() + (now.getMilliseconds() / 1000);
    const pct = Math.min(100, (secondOfMinute / 59) * 100);
    document.getElementById('progressBar').style.width = pct + '%';

    if (diff <= 0) {
      clearInterval(interval);
      document.getElementById('timer').textContent = '00:00:00';
      document.getElementById('alarmMsg').style.display = 'block';
      barra.className = 'overtime';
      if (playAlarm) document.getElementById('alarmSound').play();
      closeAndroidNotification();
      return;
    }

    const mins = diff / 60000;
    barra.className = mins <= 30 ? 'warning' : 'running';

    const hours = Math.floor(diff / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
    const display = hours > 0
      ? String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + seconds
      : String(minutes) + ':' + seconds;
    document.getElementById('timer').textContent = display;
    const totalMinutes = Math.ceil(diff / 60000);
    const noticeHours = Math.floor(totalMinutes / 60);
    const noticeMinutes = totalMinutes % 60;
    const noticeText = noticeHours > 0
      ? 'Restam ' + noticeHours + 'h' + (noticeMinutes ? ' ' + noticeMinutes + 'min' : '')
      : 'Restam ' + (noticeMinutes || 1) + 'min';
    updateAndroidNotification(noticeText);
  }

  function finishTask() { resetTimer(); }

  function resetTimer() {
    clearInterval(interval);
    document.getElementById('alarmSound').pause();
    document.getElementById('timer').textContent = '00:00:00';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('btnStart').style.display = 'block';
    document.getElementById('btnDone').style.display = 'none';
    document.getElementById('alarmMsg').style.display = 'none';
    barra.className = '';
    localStorage.removeItem(TIMER_STORAGE_KEY);
    closeAndroidNotification();
  }

  function saveTimerState() {
    if (!targetDate) return;
    localStorage.setItem(TIMER_STORAGE_KEY, JSON.stringify({
      targetDate: targetDate.getTime(),
      targetTime: document.getElementById('targetTime').value,
      taskName: document.getElementById('taskName').value
    }));
  }

  function restoreTimerState() {
    const saved = localStorage.getItem(TIMER_STORAGE_KEY);
    if (!saved) return;
    try {
      const state = JSON.parse(saved);
      if (!state.targetDate) return;
      targetDate = new Date(state.targetDate);
      document.getElementById('targetTime').value = state.targetTime || '';
      document.getElementById('taskName').value = state.taskName || '';
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnDone').style.display = 'block';
      notificationEnabled = 'Notification' in window && Notification.permission === 'granted';
      tick(false);
      if (targetDate > new Date()) interval = setInterval(() => tick(false), 1000);
    } catch (error) {
      localStorage.removeItem(TIMER_STORAGE_KEY);
    }
  }

  document.getElementById('taskName').addEventListener('input', saveTimerState);
  document.getElementById('targetTime').addEventListener('change', saveTimerState);
  restoreTimerState();

  async function refreshPage() {
    try {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map((name) => caches.delete(name)));
      }
    } finally { window.location.reload(); }
  }

  // Registra Service Worker para PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
    });
  }
</script>
</body>
</html>
