<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    /* ===================== CONTADOR ===================== */
    #contador {
      width: 320px;
      background: #fff;
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px 20px;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      transition: background 0.4s ease, color 0.4s ease;
    }

    #contador::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(255,80,80,0.4) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      z-index: 0;
    }

    #contador.running {
      color: #fff;
      animation: bgRedPulse 2s ease-in-out infinite alternate;
    }
    #contador.running::before {
      opacity: 1;
      animation: blurPulse 2s ease-in-out infinite alternate;
    }
    #contador.overtime {
      color: #fff;
      animation: bgOvertimePulse 1.2s ease-in-out infinite alternate;
    }
    #contador.overtime::before {
      opacity: 1;
      animation: blurOvertimePulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes bgRedPulse {
      0%   { background: #7a0000; }
      100% { background: #b00000; }
    }
    @keyframes blurPulse {
      0%   { opacity: 0.4; }
      100% { opacity: 0.85; }
    }
    @keyframes bgOvertimePulse {
      0%   { background: #aa0000; }
      100% { background: #e00000; }
    }
    @keyframes blurOvertimePulse {
      0%   { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Relógio */
    .clock-row {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 1;
      width: 100%;
      justify-content: center;
    }
    #lineNow {
      font-size: 3rem;
      font-weight: bold;
      color: inherit;
      line-height: 1;
    }
    #lineToday {
      font-size: 0.95rem;
      font-weight: bold;
      color: #666;
      line-height: 1.3;
      position: relative;
      z-index: 1;
    }
    #contador.running #lineToday,
    #contador.overtime #lineToday { color: rgba(255,255,255,0.7); }

    /* Inputs */
    .input-row {
      display: flex;
      gap: 8px;
      width: 100%;
      min-width: 0;
      position: relative;
      z-index: 1;
    }
    .input-row input[type="text"] {
      flex: 1 1 60%;
      min-width: 0;
      font-size: 0.85rem;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      color: #111;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .input-row input[type="text"]::placeholder { color: #999; }
    .input-row input[type="text"]:focus { border-color: #c0392b; outline: none; }
    #contador.running .input-row input[type="text"],
    #contador.overtime .input-row input[type="text"] {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }
    #contador.running .input-row input[type="text"]::placeholder,
    #contador.overtime .input-row input[type="text"]::placeholder { color: rgba(255,255,255,0.5); }

    .input-row input[type="time"] {
      flex: 1 1 35%;
      min-width: 0;
      font-size: 0.85rem;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      color: #111;
    }
    .input-row input[type="time"]:focus { border-color: #c0392b; outline: none; }
    #contador.running .input-row input[type="time"],
    #contador.overtime .input-row input[type="time"] {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }

    /* Botões */
    .btn-row {
      display: flex;
      gap: 8px;
      width: 100%;
      min-width: 0;
      position: relative;
      z-index: 1;
    }
    .btn-row button {
      flex: 1 1 0;
      min-width: 0;
      font-size: 0.85rem;
      padding: 10px 4px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .btn-start { background: #c0392b; color: white; }
    .btn-start:hover { background: #e74c3c; }
    .btn-done  { background: #0984e3; color: white; display: none; }
    .btn-done:hover  { background: #74b9ff; }
    .btn-reset { background: #e0e0e0; color: #333; }
    .btn-reset:hover { background: #ccc; }

    /* Timer */
    .timer-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    #timer {
      font-size: 2.4rem;
      font-weight: bold;
      color: inherit;
      letter-spacing: 2px;
      transition: color 0.3s;
    }
    .timer-running  { animation: glowRed 2s ease-in-out infinite alternate; }
    .timer-overtime { color: #ff7675 !important; animation: glowOvertimeRed 1.2s ease-in-out infinite alternate; }

    @keyframes glowRed {
      0%   { text-shadow: 0 0 4px rgba(255,80,80,0.2); }
      100% { text-shadow: 0 0 16px rgba(255,80,80,0.7), 0 0 28px rgba(255,80,80,0.3); }
    }
    @keyframes glowOvertimeRed {
      0%   { text-shadow: 0 0 6px rgba(255,50,50,0.4); }
      100% { text-shadow: 0 0 24px rgba(255,50,50,1), 0 0 40px rgba(255,50,50,0.5); }
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(0,0,0,0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    #contador.running .progress-container,
    #contador.overtime .progress-container { background: rgba(255,255,255,0.2); }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #e55;
      transition: width 1s linear;
    }

    #alarmMessage {
      font-size: 0.9rem;
      font-weight: bold;
      color: #ffeaa7;
      display: none;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="contador">
    <div class="clock-row">
      <div id="lineNow">--:--</div>
      <div id="lineToday">...</div>
    </div>

    <div class="input-row">
      <input type="text" id="taskName" placeholder="Tarefa / etapa">
      <input type="time" id="targetTime">
    </div>

    <div class="btn-row">
      <button id="btnStart" class="btn-start" onclick="startTimer()">INICIAR</button>
      <button id="btnDone"  class="btn-done"  onclick="finishTask()">CONCLUIR</button>
      <button class="btn-reset" onclick="resetTimer()">RESETAR</button>
    </div>

    <div class="timer-row">
      <div id="timer">00:00:00</div>
      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="alarmMessage">⏰ TEMPO ESGOTADO!</div>
    </div>
  </div>

  <audio id="alarmSound" src="https://www.soundjay.com/buttons_c2026/sounds/button-35.mp3" onended="checkRepeat()"></audio>

  <script>
    const timerEl     = document.getElementById("timer");
    const progressBar = document.getElementById("progressBar");
    const targetInput = document.getElementById("targetTime");
    const taskInput   = document.getElementById("taskName");
    const btnStart    = document.getElementById("btnStart");
    const btnDone     = document.getElementById("btnDone");
    const contEl      = document.getElementById("contador");

    let interval, targetDate, startMoment, totalDuration;
    let playCount = 0;

    function updateClock() {
      const now = new Date();
      document.getElementById("lineNow").textContent =
        now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
      const weekday  = now.toLocaleDateString('pt-BR', {weekday: 'long'});
      const day      = now.toLocaleDateString('pt-BR', {day: '2-digit'});
      const month    = now.toLocaleDateString('pt-BR', {month: 'short'}).replace('.','');
      const monthCap = month.charAt(0).toUpperCase() + month.slice(1) + '.';
      document.getElementById("lineToday").innerHTML =
        weekday + '<br>' + day + '/' + now.toLocaleDateString('pt-BR', {month:'2-digit'}) + ' (' + monthCap + ')';
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.getElementById("targetTime").addEventListener("keydown", function(e) {
      if (e.key === "Enter") startTimer();
    });

    function startTimer() {
      const input = targetInput.value;
      if (!input) return alert("Defina a hora alvo!");

      const now = new Date();
      const [h, m] = input.split(":").map(Number);
      targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
      if (targetDate <= now) targetDate.setDate(targetDate.getDate() + 1);

      startMoment   = new Date();
      totalDuration = targetDate - startMoment;

      btnStart.style.display = "none";
      btnDone.style.display  = "block";
      timerEl.className      = "timer-running";
      contEl.classList.add("running");
      contEl.classList.remove("overtime");

      interval = setInterval(tick, 1000);
    }

    function tick() {
      const now  = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        clearInterval(interval);
        timerEl.textContent = "00:00:00";
        timerEl.className   = "timer-overtime";
        progressBar.style.width = "100%";
        document.getElementById("alarmMessage").style.display = "block";
        contEl.classList.remove("running");
        contEl.classList.add("overtime");
        playCount = 0;
        playAlarm();
        return;
      }

      const hh = String(Math.floor(diff / 3600000)).padStart(2, '0');
      const mm = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
      const ss = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
      timerEl.textContent = hh + ":" + mm + ":" + ss;

      const progress = ((now - startMoment) / totalDuration) * 100;
      progressBar.style.width = Math.min(100, progress) + "%";
    }

    function finishTask() {
      clearInterval(interval);
      const history = JSON.parse(localStorage.getItem('contador_tasks') || '[]');
      history.push({ name: taskInput.value || "Tarefa", time: new Date().toLocaleTimeString() });
      localStorage.setItem('contador_tasks', JSON.stringify(history));
      resetTimer();
    }

    function resetTimer() {
      clearInterval(interval);
      playCount = 3;
      const sound = document.getElementById("alarmSound");
      sound.pause();
      sound.currentTime = 0;
      timerEl.textContent = "00:00:00";
      timerEl.className   = "";
      progressBar.style.width = "0%";
      btnStart.style.display = "block";
      btnDone.style.display  = "none";
      document.getElementById("alarmMessage").style.display = "none";
      contEl.classList.remove("running", "overtime");
    }

    function playAlarm() {
      if (playCount < 3) {
        document.getElementById("alarmSound").play().catch(function(e) {});
      }
    }

    function checkRepeat() {
      playCount++;
      if (playCount < 3) {
        setTimeout(function() {
          document.getElementById("alarmSound").currentTime = 0;
          playAlarm();
        }, 200);
      }
    }
  </script>
</body>
</html>
