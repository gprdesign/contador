<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #111;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
    }

    #barra {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      gap: 20px;
      position: fixed;
      top: 0; left: 0;
      z-index: 999;
    }

    /* BLOCO 1: Cabeçalho (Data/Hora) */
    .block-clock {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      min-width: fit-content;
    }
    #lineNow {
      font-size: clamp(1.2rem, 4vh, 2rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .clock-meta {
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(255,255,255,0.2);
      padding-left: 10px;
      line-height: 1.1;
    }
    #lineWeekday { font-size: 0.75rem; font-weight: 600; color: rgba(255,255,255,0.8); }
    #lineDate { font-size: 0.65rem; color: rgba(255,255,255,0.5); }

    /* BLOCO 2: Contador Regressivo */
    .block-timer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 2;
      min-width: 0;
      text-align: center;
    }
    #timer {
      font-size: clamp(1.8rem, 10vw, 8rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.9;
      font-variant-numeric: tabular-nums;
    }
    .progress-wrap {
      width: 100%;
      max-width: 400px;
      height: 4px;
      background: rgba(255,255,255,0.1);
      margin-top: 6px;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%; width: 0%;
      background: #ccff00;
      transition: width 0.5s ease;
    }
    #alarmMsg {
      font-size: 0.7rem;
      font-weight: 800;
      color: #ffeaa7;
      margin-top: 4px;
      display: none;
    }

    /* BLOCO 3: Campos + Botões */
    .block-controls {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      flex: 1;
      justify-content: flex-end;
      min-width: fit-content;
    }
    .ctrl-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }
    input {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 6px;
      height: 34px;
      padding: 0 10px;
      outline: none;
      font-size: 0.85rem;
    }
    #taskName { width: clamp(120px, 15vw, 220px); }
    #targetTime { width: 90px; }

    button {
      height: 34px;
      border-radius: 6px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      padding: 0 15px;
      font-size: 0.75rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.8; }
    .btn-start { background: #00b894; color: #fff; }
    .btn-done { background: #0984e3; color: #fff; display: none; }
    .btn-reset { background: rgba(255,255,255,0.15); color: #fff; width: 34px; padding: 0; }

    .sep {
      width: 1px;
      height: 30px;
      background: rgba(255,255,255,0.15);
      flex-shrink: 0;
    }

    /* Estados de Alerta */
    #barra.running { background: #111; }
    #barra.warning { background: #e67e22; } /* Laranja */
    #barra.overtime { background: #c0392b; animation: blink 0.5s infinite alternate; } /* Vermelho */
    @keyframes blink { from { opacity: 1; } to { opacity: 0.7; } }

    /* Responsividade Celular */
    @media (max-width: 750px) {
      .block-clock { display: none; }
      .sep { display: none; }
    }
  </style>
</head>
<body>

<div id="barra">
  <!-- BLOCO 1 -->
  <div class="block-clock">
    <div id="lineNow">00:00</div>
    <div class="clock-meta">
      <span id="lineWeekday">...</span>
      <span id="lineDate">...</span>
    </div>
  </div>

  <div class="sep"></div>

  <!-- BLOCO 2 -->
  <div class="block-timer">
    <div id="timer">00:00:00</div>
    <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <div id="alarmMsg">⏰ TEMPO ESGOTADO!</div>
  </div>

  <div class="sep"></div>

  <!-- BLOCO 3 -->
  <div class="block-controls">
    <div class="ctrl-row">
      <input type="text" id="taskName" placeholder="O que está fazendo?">
      <input type="time" id="targetTime">
    </div>
    <div class="ctrl-row">
      <button id="btnStart" class="btn-start" onclick="startTimer()">INICIAR</button>
      <button id="btnDone" class="btn-done" onclick="finishTask()">CONCLUIR</button>
      <button class="btn-reset" onclick="resetTimer()">↺</button>
    </div>
  </div>
</div>

<audio id="alarmSound" src="https://www.soundjay.com/buttons/sounds/button-35.mp3"></audio>

<script>
  function updateClock() {
    const now = new Date();
    document.getElementById('lineNow').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const wd = now.toLocaleDateString('pt-BR', { weekday: 'long' });
    document.getElementById('lineWeekday').textContent = wd.charAt(0).toUpperCase() + wd.slice(1);
    const d = String(now.getDate()).padStart(2, '0');
    const m = String(now.getMonth() + 1).padStart(2, '0');
    document.getElementById('lineDate').textContent = d + '/' + m;
  }
  setInterval(updateClock, 1000); updateClock();

  let interval, targetDate;
  const barra = document.getElementById('barra');

  function startTimer() {
    const val = document.getElementById('targetTime').value;
    if (!val) return;
    const [h, m] = val.split(':').map(Number);
    const now = new Date();
    targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
    if (targetDate <= now) targetDate.setDate(targetDate.getDate() + 1);

    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('btnDone').style.display = 'block';
    
    clearInterval(interval);
    interval = setInterval(tick, 1000); tick();
  }

  function tick() {
    const now = new Date();
    const diff = targetDate - now;

    // Barra de progresso baseada no dia (09:00 até target)
    const base = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 9, 0, 0);
    if (base > targetDate) base.setDate(base.getDate() - 1);
    const total = targetDate - base;
    const elapsed = now - base;
    const pct = Math.max(0, Math.min(100, (elapsed / total) * 100));
    document.getElementById('progressBar').style.width = pct + '%';

    if (diff <= 0) {
      clearInterval(interval);
      document.getElementById('timer').textContent = '00:00:00';
      document.getElementById('alarmMsg').style.display = 'block';
      barra.className = 'overtime';
      document.getElementById('alarmSound').play();
      return;
    }

    const mins = diff / 60000;
    barra.className = mins <= 30 ? 'warning' : 'running';

    const hh = String(Math.floor(diff / 3600000)).padStart(2, '0');
    const mm = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
    const ss = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
    document.getElementById('timer').textContent = hh + ':' + mm + ':' + ss;
  }

  function finishTask() { resetTimer(); }

  function resetTimer() {
    clearInterval(interval);
    document.getElementById('alarmSound').pause();
    document.getElementById('timer').textContent = '00:00:00';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('btnStart').style.display = 'block';
    document.getElementById('btnDone').style.display = 'none';
    document.getElementById('alarmMsg').style.display = 'none';
    barra.className = '';
  }
</script>
</body>
</html>
