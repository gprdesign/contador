<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contador</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #111;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
    }

    #barra {
      width: 100%;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(280px, 2fr) minmax(280px, 1.5fr);
      grid-template-areas: "clock timer controls";
      align-items: center;
      gap: clamp(20px, 4vw, 60px);
      padding: clamp(20px, 4vw, 60px);
      transition: background 0.3s ease;
    }

    /* BLOCO 1: Relógio */
    .block-clock {
      grid-area: clock;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 0;
    }
    #lineNow {
      font-size: clamp(1rem, 3.5vh, 1.8rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .clock-meta {
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(255,255,255,0.2);
      padding-left: 10px;
      line-height: 1.1;
    }
    #lineWeekday { font-size: 0.7rem; font-weight: 600; color: rgba(255,255,255,0.7); }
    #lineDate { font-size: 0.6rem; color: rgba(255,255,255,0.4); }

    /* BLOCO 2: Timer */
    .block-timer {
      grid-area: timer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }
    #timer {
      font-size: clamp(1.5rem, 12vw, 7rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.85;
      font-variant-numeric: tabular-nums;
    }
    .progress-wrap {
      width: 100%;
      max-width: 350px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      margin-top: 5px;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%; width: 0%;
      background: #ccff00;
      transition: width 0.5s ease;
    }

    /* BLOCO 3: Controles */
    .block-controls {
      grid-area: controls;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 12px;
      min-width: 0;
    }
    .ctrl-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }
    input {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 6px;
      height: 32px;
      padding: 0 8px;
      outline: none;
      font-size: 0.8rem;
    }
    #taskName { width: clamp(80px, 12vw, 180px); }
    #targetTime { width: 85px; }

    button {
      height: 32px;
      border-radius: 6px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      padding: 0 12px;
      font-size: 0.7rem;
      white-space: nowrap;
    }
    .btn-start { background: #00b894; color: #fff; }
    .btn-done { background: #0984e3; color: #fff; display: none; }
    .btn-reset { background: rgba(255,255,255,0.2); color: #fff; width: 32px; padding: 0; }

    .sep {
      display: none;
    }

    /* Estados */
    #barra.warning { background: #d35400; }
    #barra.overtime { background: #c0392b; animation: blink 0.5s infinite alternate; }
    @keyframes blink { from { opacity: 1; } to { opacity: 0.8; } }
    #alarmMsg { font-size: 0.6rem; font-weight: 800; color: #ffeaa7; display: none; margin-top: 2px; }

    /* Layout responsivo: desktop, tablet e celular */
    @media (max-width: 1100px) {
      #barra {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "timer timer"
          "clock controls";
        gap: 28px;
      }

      #timer {
        font-size: clamp(4rem, 14vw, 7rem);
      }

      .block-controls {
        width: 100%;
      }

      .ctrl-row {
        width: 100%;
      }

      #taskName {
        flex: 1;
        width: auto;
        min-width: 0;
      }
    }

    @media (max-width: 600px) {
      #barra {
        min-height: 100dvh;
        grid-template-columns: 1fr;
        grid-template-areas:
          "timer"
          "clock"
          "controls";
        align-content: center;
        gap: 28px;
        padding: 24px 16px;
      }

      #timer {
        width: 100%;
        text-align: center;
        font-size: clamp(3.2rem, 18vw, 5rem);
        letter-spacing: -0.07em;
      }

      .progress-wrap {
        width: min(100%, 330px);
      }

      .block-clock {
        flex-direction: column;
        gap: 5px;
        text-align: center;
      }

      .clock-meta {
        border-left: none;
        padding-left: 0;
        align-items: center;
      }

      .block-controls {
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
      }

      .ctrl-row {
        display: flex;
        width: 100%;
        gap: 8px;
      }

      #taskName {
        flex: 1;
        width: auto;
        min-width: 0;
      }

      #targetTime {
        width: 105px;
        flex-shrink: 0;
      }

      button {
        flex: 1;
      }

      .btn-reset {
        flex: 0 0 38px;
      }
    }

    /* Janelas desktop muito baixas */
    @media (max-height: 200px) and (min-width: 1101px) {
      #barra {
        min-height: 100dvh;
        padding: 12px 20px;
        gap: 20px;
      }

      .clock-meta { display: none; }
      #timer { font-size: clamp(1.5rem, 6vw, 3rem); }
      input, button { height: 28px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<div id="barra">
  <!-- BLOCO 1 -->
  <div class="block-clock">
    <div id="lineNow">00:00</div>
    <div class="clock-meta">
      <span id="lineWeekday">...</span>
      <span id="lineDate">...</span>
    </div>
  </div>

  <div class="sep"></div>

  <!-- BLOCO 2 -->
  <div class="block-timer">
    <div id="timer">00:00:00</div>
    <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <div id="alarmMsg">⏰ TEMPO ESGOTADO!</div>
  </div>

  <div class="sep"></div>

  <!-- BLOCO 3 -->
  <div class="block-controls">
    <div class="ctrl-row">
      <input type="text" id="taskName" placeholder="O que está fazendo?">
      <input type="time" id="targetTime">
    </div>
    <div class="ctrl-row">
      <button id="btnStart" class="btn-start" onclick="startTimer()">INICIAR</button>
      <button id="btnDone" class="btn-done" onclick="finishTask()">CONCLUIR</button>
      <button class="btn-reset" onclick="resetTimer()">↺</button>
    </div>
  </div>
</div>

<audio id="alarmSound" src="https://www.soundjay.com/buttons/sounds/button-35.mp3"></audio>

<script>
  function updateClock() {
    const now = new Date();
    document.getElementById('lineNow').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const wd = now.toLocaleDateString('pt-BR', { weekday: 'long' });
    document.getElementById('lineWeekday').textContent = wd.charAt(0).toUpperCase() + wd.slice(1);
    const d = String(now.getDate()).padStart(2, '0');
    const m = String(now.getMonth() + 1).padStart(2, '0');
    document.getElementById('lineDate').textContent = d + '/' + m;
  }
  setInterval(updateClock, 1000); updateClock();

  let interval, targetDate;
  const barra = document.getElementById('barra');

  function startTimer() {
    const val = document.getElementById('targetTime').value;
    if (!val) return;
    const [h, m] = val.split(':').map(Number);
    const now = new Date();
    targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
    if (targetDate <= now) targetDate.setDate(targetDate.getDate() + 1);

    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('btnDone').style.display = 'block';
    
    clearInterval(interval);
    interval = setInterval(tick, 1000); tick();
  }

  function tick() {
    const now = new Date();
    const diff = targetDate - now;

    const base = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 9, 0, 0);
    if (base > targetDate) base.setDate(base.getDate() - 1);
    const total = targetDate - base;
    const elapsed = now - base;
    const pct = Math.max(0, Math.min(100, (elapsed / total) * 100));
    document.getElementById('progressBar').style.width = pct + '%';

    if (diff <= 0) {
      clearInterval(interval);
      document.getElementById('timer').textContent = '00:00:00';
      document.getElementById('alarmMsg').style.display = 'block';
      barra.className = 'overtime';
      document.getElementById('alarmSound').play();
      return;
    }

    const mins = diff / 60000;
    barra.className = mins <= 30 ? 'warning' : 'running';

    const hh = String(Math.floor(diff / 3600000)).padStart(2, '0');
    const mm = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
    const ss = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
    document.getElementById('timer').textContent = hh + ':' + mm + ':' + ss;
  }

  function finishTask() { resetTimer(); }

  function resetTimer() {
    clearInterval(interval);
    document.getElementById('alarmSound').pause();
    document.getElementById('timer').textContent = '00:00:00';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('btnStart').style.display = 'block';
    document.getElementById('btnDone').style.display = 'none';
    document.getElementById('alarmMsg').style.display = 'none';
    barra.className = '';
  }

  // Registra Service Worker para PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
    });
  }
</script>
</body>
</html>
