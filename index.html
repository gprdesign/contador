<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#0b1120; --panel:rgba(20,30,52,.58); --line:rgba(255,255,255,.11); --muted:#94a3b8; --cyan:#38bdf8; --violet:#818cf8; }
    html,body { width:100%; height:100svh; min-height:0; max-height:100svh; overflow:hidden; overscroll-behavior:none; touch-action:pan-y; background:var(--bg); color:#f8fafc; font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    body { height:100svh; min-height:0; max-height:100svh; overflow:hidden; background:radial-gradient(ellipse at 15% 20%,rgba(56,189,248,.13),transparent 38%),radial-gradient(ellipse at 85% 80%,rgba(129,140,248,.12),transparent 40%),linear-gradient(135deg,#0b1120 0%,#111827 50%,#0b1120 100%); }
    #barra { width:100%; height:100svh; min-height:0; max-height:100svh; overflow:hidden; display:grid; grid-template-columns:minmax(390px,1.8fr) minmax(300px,1fr); grid-template-areas:'timer controls'; align-items:stretch; gap:clamp(14px,2vw,28px); padding:clamp(16px,3vw,42px); transition:background .3s ease; position:relative; isolation:isolate; }
    #barra::before { content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(120deg,rgba(255,255,255,.025),transparent 45%,rgba(255,255,255,.02)); z-index:-1; }
    .block-clock,.block-timer,.block-controls { background:var(--panel); border:1px solid var(--line); border-radius:24px; backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); box-shadow:0 24px 70px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.05); }
    .block-clock { display:none; grid-area:clock; flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:18px; padding:clamp(22px,3vw,34px); }
    #lineNow { font-size:clamp(2.2rem,4vw,4.4rem); line-height:.95; font-weight:800; letter-spacing:-.07em; font-variant-numeric:tabular-nums; color:#f8fafc; }
    .clock-meta { display:flex; flex-direction:column; gap:5px; border-left:2px solid var(--cyan); padding-left:14px; line-height:1.2; }
    #lineWeekday { font-size:1rem; font-weight:700; color:#e2e8f0; } #lineDate { font-size:.85rem; color:var(--muted); }
    .block-timer { grid-area:timer; min-width:0; position:relative; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:calc(clamp(24px,4vw,56px) + 56px) clamp(24px,4vw,56px) clamp(24px,4vw,56px); border-color:rgba(56,189,248,.28); background:linear-gradient(145deg,rgba(56,189,248,.13),rgba(129,140,248,.08) 55%,rgba(20,30,52,.62)); box-shadow:0 30px 90px rgba(56,189,248,.11),inset 0 1px rgba(255,255,255,.1); }
    #timer { width:100%; text-align:center; font-size:clamp(4rem,10vw,10rem); font-weight:900; line-height:.9; letter-spacing:-.025em; font-weight:750; font-variant-numeric:tabular-nums; text-shadow:0 0 18px rgba(56,189,248,.10); white-space:nowrap; }
    .block-timer:fullscreen, .block-timer:-webkit-full-screen { overflow:hidden; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:minmax(0,1fr); align-items:stretch; gap:clamp(16px,2vw,28px); padding:clamp(24px,4vw,60px); border-radius:24px; }
    .fullscreen-side-panel { display:none; }
    .block-timer:fullscreen .fullscreen-side-panel, .block-timer:-webkit-full-screen .fullscreen-side-panel { display:flex; grid-column:3; grid-row:1; min-width:0; min-height:0; flex-direction:column; align-items:stretch; justify-content:flex-start; gap:clamp(24px,5vh,60px); padding:clamp(22px,3vw,34px); background:var(--panel); border:1px solid var(--line); border-radius:24px; backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); box-shadow:0 24px 70px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.05); }
    .fullscreen-clock { display:none; width:100%; min-height:86px; background:var(--panel); border:1px solid var(--line); border-radius:24px; backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); box-shadow:0 24px 70px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.05); padding:clamp(22px,3vw,34px); }
    .block-timer:fullscreen .fullscreen-clock, .block-timer:-webkit-full-screen .fullscreen-clock { display:flex; flex-direction:row; align-items:center; justify-content:space-between; gap:14px; min-height:0; padding:0 0 clamp(20px,3vh,36px); background:transparent; border:0; border-radius:0; box-shadow:none; }
    .ampm { font-size:.5em; margin-left:.12em; letter-spacing:0; vertical-align:baseline; }
    .fullscreen-clock-now { font-size:clamp(1.4rem,2.2vw,2.4rem); line-height:.95; font-weight:800; letter-spacing:-.07em; font-variant-numeric:tabular-nums; color:#f8fafc; }
    .fullscreen-clock-meta { display:flex; flex-direction:column; gap:5px; border-left:2px solid var(--cyan); padding-left:14px; line-height:1.2; }
    .fullscreen-clock-weekday { font-size:1rem; font-weight:700; color:#e2e8f0; } .fullscreen-clock-date { font-size:.85rem; color:var(--muted); }
    #fullscreenTask { display:none; max-width:min(90vw,1400px); flex-wrap:wrap; align-items:baseline; justify-content:center; gap:clamp(12px,2vw,30px); text-align:center; color:#f8fafc; line-height:1.1; font-weight:800; overflow-wrap:anywhere; text-shadow:0 2px 18px rgba(0,0,0,.35); }
    #fullscreenTaskName, #fullscreenTargetTime { width:100%; font-size:clamp(1.2rem,2.8vw,2.6rem); text-transform:uppercase; letter-spacing:.03em; text-align:center; }
    #fullscreenTargetTime { color:rgba(255,255,255,.55); font-weight:800; }
    .fullscreen-timer-box { display:contents; } .fullscreen-counter-content { display:contents; } .block-timer:fullscreen .fullscreen-counter-content, .block-timer:-webkit-full-screen .fullscreen-counter-content { display:flex; flex:1; width:100%; min-height:0; flex-direction:column; align-items:center; justify-content:center; }
    .block-timer:fullscreen .fullscreen-timer-box, .block-timer:-webkit-full-screen .fullscreen-timer-box { display:flex; grid-column:1 / span 2; min-width:0; min-height:0; flex-direction:column; align-items:center; justify-content:flex-start; background:var(--panel); border:1px solid rgba(56,189,248,.28); border-radius:24px; padding:clamp(24px,4vw,56px); box-shadow:0 30px 90px rgba(56,189,248,.11),inset 0 1px rgba(255,255,255,.1); }
    .fullscreen-exit { display:none; }
    .block-timer:fullscreen .fullscreen-exit, .block-timer:-webkit-full-screen .fullscreen-exit { display:block; width:100%; flex:0 0 auto; margin-bottom:clamp(18px,4vh,36px); }
    .block-timer:fullscreen .top-actions .btn-fullscreen, .block-timer:-webkit-full-screen .top-actions .btn-fullscreen { display:none; }
    .block-timer:fullscreen #fullscreenTask, .block-timer:-webkit-full-screen #fullscreenTask { display:flex; min-width:0; min-height:0; flex:1; margin:0; padding:clamp(18px,2.5vw,28px); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.13); border-radius:18px; box-shadow:inset 0 1px rgba(255,255,255,.06); flex-direction:column; align-items:center; justify-content:center; }
 .block-timer:fullscreen .top-actions .btn-refresh, .block-timer:-webkit-full-screen .top-actions .btn-refresh { display:none; } .block-timer:fullscreen .top-actions, .block-timer:-webkit-full-screen .top-actions { justify-content:flex-end; } .block-timer:fullscreen .btn-fullscreen, .block-timer:-webkit-full-screen .btn-fullscreen { flex:0 0 auto; width:auto; }
 .top-actions { position:absolute; top:clamp(24px,4vw,56px); left:0; right:0; width:auto; z-index:20; display:flex; gap:8px; padding:0 clamp(24px,4vw,56px); } .top-actions button { flex:1 1 0; width:0; min-width:0; height:44px; padding:0 8px; font-size:.75rem; } .btn-fullscreen { position:static; background:rgba(15,23,42,.45); color:#e2e8f0; border-color:rgba(255,255,255,.16); font-size:.75rem; z-index:3; } .btn-fullscreen:hover { background:rgba(56,189,248,.22); }
    .progress-wrap { width:min(100%,520px); height:6px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); margin-top:22px; border-radius:99px; overflow:hidden; box-shadow:inset 0 0 4px rgba(255,255,255,.08); }
    .progress-bar { height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--violet)); box-shadow:0 0 18px rgba(56,189,248,.95); transition:width .5s ease; animation:progressPulse .8s ease-in-out infinite; }
    .block-controls { grid-area:controls; min-height:0; display:flex; flex-direction:column; align-items:stretch; justify-content:center; gap:14px; padding:clamp(22px,3vw,34px); }
    .ctrl-row { display:flex; align-items:center; gap:8px; width:100%; }
    input { width:100%; height:44px; background:rgba(15,23,42,.65); border:1px solid rgba(255,255,255,.12); color:#fff; border-radius:12px; padding:0 12px; outline:none; font:inherit; font-size:.82rem; }
    input:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(56,189,248,.12); } #targetTime { width:116px; flex-shrink:0; text-align:center; }
    select { flex:1; min-width:0; height:44px; background:rgba(15,23,42,.65); border:1px solid rgba(255,255,255,.12); color:#fff; border-radius:12px; padding:0 12px; outline:none; font:inherit; font-size:.82rem; }
    select:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(56,189,248,.12); } select option { color:#0f172a; }
    .btn-tick-mute { flex:0 0 auto; min-width:106px; background:rgba(250,204,21,.12); color:#fef3c7; border-color:rgba(250,204,21,.32); } .btn-tick-mute:hover { background:rgba(250,204,21,.22); }
    button { height:44px; border-radius:12px; border:1px solid transparent; font-weight:800; cursor:pointer; padding:0 16px; font-size:.75rem; white-space:nowrap; transition:transform .2s,filter .2s; }
    button:hover { transform:translateY(-2px); filter:brightness(1.1); } .btn-start { flex:1; background:linear-gradient(135deg,#22c55e,#0ea5a4); color:#fff; } .btn-done { flex:1; background:linear-gradient(135deg,#38bdf8,#6366f1); color:#fff; display:none; } .btn-reset { background:rgba(255,255,255,.1); color:#fff; width:44px; padding:0; flex-shrink:0; border-color:rgba(255,255,255,.12); } .btn-refresh { width:auto; background:rgba(255,255,255,.06); color:#cbd5e1; border-color:rgba(255,255,255,.12); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .daily-task-panel { width:100%; min-height:0; max-height:min(34vh,220px); display:flex; flex-direction:column; gap:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.1); }
    .daily-task-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; color:#e2e8f0; font-size:.72rem; font-weight:850; letter-spacing:.05em; }
    .daily-task-heading span { color:var(--muted); font-size:.68rem; letter-spacing:0; }
    .daily-task-form { display:flex; gap:7px; }
    .daily-task-form input { flex:1; min-width:0; height:38px; }
    .daily-task-form button { flex:none; height:38px; padding:0 12px; background:rgba(56,189,248,.15); color:#e0f2fe; border:1px solid rgba(56,189,248,.3); }
    .daily-task-list { display:grid; gap:5px; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
    .daily-task-row { display:flex; align-items:center; gap:8px; min-height:34px; padding:3px 7px; border:1px solid rgba(255,255,255,.09); border-radius:9px; background:rgba(15,23,42,.44); }

    .daily-task-row.is-dragging { opacity:.45; border-color:rgba(56,189,248,.8); }

    .daily-task-toggle { flex:none; width:28px; height:28px; padding:0; border:1px solid rgba(148,163,184,.42); background:transparent; color:#86efac; }
    .daily-task-toggle[aria-pressed="true"] { border-color:rgba(34,197,94,.5); background:rgba(34,197,94,.15); }
    .daily-task-name { flex:1; min-width:0; overflow-wrap:anywhere; color:#f1f5f9; font-size:.78rem; line-height:1.25; }
    .daily-task-row.is-done .daily-task-name { color:#94a3b8; text-decoration:line-through; }
    .daily-task-delete { flex:none; width:28px; height:28px; padding:0; background:transparent; color:#94a3b8; }
    .daily-task-empty { padding:5px 3px; color:#94a3b8; font-size:.72rem; }
    .pip-task-label { color:#cbd5e1; }
    .btn-mini-player { background:rgba(56,189,248,.13); color:#e0f2fe; border-color:rgba(56,189,248,.28); }
    .btn-mini-player:hover { background:rgba(56,189,248,.24); }
    .block-timer:fullscreen .top-actions .btn-mini-player, .block-timer:-webkit-full-screen .top-actions .btn-mini-player { display:none; }
    .sep { display:none; } #alarmMsg { font-size:.75rem; font-weight:800; color:#fde68a; display:none; margin-top:12px; }
    #barra.warning .block-timer { border-color:rgba(245,158,11,.7); box-shadow:0 0 70px rgba(245,158,11,.14),inset 0 1px rgba(255,255,255,.1); } #barra.overtime .block-timer { border-color:rgba(239,68,68,.75); box-shadow:0 0 80px rgba(239,68,68,.2),inset 0 1px rgba(255,255,255,.1); animation:blink .5s infinite alternate; } @keyframes blink { from{opacity:1} to{opacity:.82} } @keyframes progressPulse { 0%,100%{opacity:.45;filter:brightness(.85);box-shadow:0 0 8px rgba(56,189,248,.45)} 50%{opacity:1;filter:brightness(1.55);box-shadow:0 0 24px rgba(56,189,248,1),0 0 42px rgba(129,140,248,.65)} }
    @media (max-width:1050px) { #barra { grid-template-columns:1.4fr 1fr; grid-template-areas:'timer controls'; } .block-clock { min-height:150px; flex-direction:row; align-items:center; justify-content:space-between; } .block-timer { min-height:300px; } #timer { font-size:clamp(4rem,11vw,7rem); } }
    @media (max-width:650px) { #barra { height:100svh; max-height:100svh; min-height:100svh; grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; grid-template-areas:'timer' 'controls'; align-content:stretch; gap:12px; --nav-bottom:0px; padding:12px; overflow:hidden; } .block-clock,.block-timer,.block-controls { border-radius:18px; } .block-clock { min-height:86px; padding:20px 22px; flex-direction:row; align-items:center; justify-content:space-between; gap:14px; } #lineNow { font-size:clamp(2.4rem,14vw,3.5rem); } .clock-meta { padding-left:10px; gap:3px; } #lineWeekday { font-size:.86rem; } #lineDate { font-size:.76rem; } .block-timer { min-height:0; padding:80px 12px 24px; } .top-actions { top:24px; padding:0 12px; } #timer { font-size:clamp(3.8rem,19vw,6rem); } .progress-wrap { margin-top:16px; } .block-controls { min-height:0; padding:16px 20px; gap:10px; } .ctrl-row { gap:10px; } input { height:48px; font-size:.95rem; } select { height:48px; font-size:.9rem; } button { height:48px; font-size:.8rem; } #targetTime { width:116px; } .daily-task-panel { max-height:28vh; } .daily-task-form input,.daily-task-form button { height:42px; } }
    @media (max-height:650px) and (max-width:650px) {
      #barra { gap:8px; --nav-bottom:0px; padding:8px 12px max(8px,env(safe-area-inset-bottom,0px)); }
      .block-clock { min-height:68px; padding:12px 16px; }
      #lineNow { font-size:clamp(1.8rem,10vw,2.6rem); }
      #lineWeekday { font-size:.72rem; } #lineDate { font-size:.65rem; }
      .block-timer { padding:68px 10px 18px; }
      #timer { font-size:clamp(2.8rem,16vw,4.4rem); }
      .progress-wrap { margin-top:10px; }
      .block-controls { min-height:0; padding:8px 12px; gap:6px; }
      input,button { height:34px; font-size:.68rem; } select { height:34px; font-size:.68rem; }
      #targetTime { width:100px; }
      .daily-task-panel { max-height:23vh; gap:5px; padding-top:5px; }
      .daily-task-form input,.daily-task-form button { height:32px; }
      .daily-task-row { min-height:30px; }
      .daily-task-toggle,.daily-task-delete { width:26px; height:26px; }
    }

    @media (max-height:500px) and (min-width:651px) { #barra { padding:12px 20px; gap:12px; } .block-clock,.block-timer,.block-controls { min-height:0; padding:18px; } #timer { font-size:clamp(3rem,8vw,6rem); } }

    @media (max-width:700px) {
      .block-timer:fullscreen, .block-timer:-webkit-full-screen { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); gap:12px; padding:12px; }
      .block-timer:fullscreen .fullscreen-side-panel, .block-timer:-webkit-full-screen .fullscreen-side-panel { grid-column:1; grid-row:1; min-height:0; padding:16px; gap:16px; border-radius:18px; }
      .block-timer:fullscreen .fullscreen-timer-box, .block-timer:-webkit-full-screen .fullscreen-timer-box { grid-column:1; grid-row:2; min-height:0; padding:16px; border-radius:18px; }

<body>

<div id="barra">
  <!-- BLOCO 1 -->
  <div class="block-clock">
    <div id="lineNow"><span id="lineNowValue">00:00</span><span id="lineNowMeridiem" class="ampm">AM</span></div>
    <div class="clock-meta">
      <span id="lineWeekday">...</span>
      <span id="lineDate">...</span>
    </div>
  </div>

  <div class="sep"></div>

  <!-- BLOCO 2 -->
  <div id="blockTimer" class="block-timer">
    <div class="top-actions">
      <button id="btnFullscreen" class="btn-fullscreen" type="button" onclick="toggleFullscreen()" aria-label="Expandir contador em tela cheia">⛶ TELA CHEIA</button>
      <button id="btnMiniPlayer" class="btn-mini-player" type="button" onclick="toggleMiniPlayer()" aria-label="Abrir contador em janela flutuante">▣ MINI PLAYER</button>
      <button class="btn-refresh" type="button" onclick="refreshPage()">↻ ATUALIZAR PÁGINA</button>
    </div>
    <div class="fullscreen-side-panel">
    <div class="fullscreen-clock" aria-hidden="true">
      <div id="fullscreenLineNow" class="fullscreen-clock-now"><span id="fullscreenLineNowValue">00:00</span><span id="fullscreenLineNowMeridiem" class="ampm">AM</span></div>
      <div class="fullscreen-clock-meta">
        <div id="fullscreenLineWeekday" class="fullscreen-clock-weekday">...</div>
        <div id="fullscreenLineDate" class="fullscreen-clock-date">...</div>
      </div>
    </div>
    <div id="fullscreenTask" aria-live="polite"><div id="fullscreenTaskName"></div><div id="fullscreenTargetTime"></div></div>
    </div>
    <div class="fullscreen-timer-box">
      <button class="fullscreen-exit btn-refresh" type="button" onclick="toggleFullscreen()">⛶ SAIR DA TELA CHEIA</button>
      <div class="fullscreen-counter-content">
        <div id="timer">00:00:00</div>
        <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
        <div id="alarmMsg">⏰ TEMPO ESGOTADO!</div>
      </div>
    </div>
  </div>

  <div class="sep"></div>

  <!-- BLOCO 3 -->
  <div class="block-controls">
    <div class="ctrl-row">
      <input type="text" id="taskName" placeholder="O que vem por aí?!">
      <input type="time" id="targetTime" lang="en-US">
    </div>
    <div class="ctrl-row">
      <button id="btnStart" class="btn-start" onclick="startTimer()">INICIAR</button>
      <button id="btnDone" class="btn-done" onclick="finishTask()">CONCLUIR</button>
      <button class="btn-reset" onclick="resetTimer()">↺</button>
    </div>
    <div class="ctrl-row sound-row">
      <select id="tickSoundStyle" aria-label="Estilo do tique-taque">
        <option value="classic">Clássico</option>
        <option value="soft">Suave</option>
        <option value="wood">Madeira</option>
        <option value="deep">Grave</option>
      </select>
      <button id="btnTickMute" class="btn-tick-mute" type="button" aria-label="Mutar tique-taque">MUTAR TICK</button>
    </div>
    <section class="daily-task-panel" aria-label="Tarefas do dia"><div class="daily-task-heading">TAREFAS DO DIA <span id="dailyTaskProgress">0/0 concluídas</span></div><form id="dailyTaskForm" class="daily-task-form"><label class="sr-only" for="dailyTaskInput">Adicionar tarefa do dia</label><input id="dailyTaskInput" type="text" maxlength="100" placeholder="Tarefa para concluir hoje…" required><button type="submit">＋ ADICIONAR</button></form><div id="dailyTaskList" class="daily-task-list" aria-live="polite"></div></section>
  </div>
</div>

<audio id="alarmSound" src="https://www.soundjay.com/buttons/sounds/button-35.mp3"></audio>

<script>
  let miniPlayerVideo = null;
  let miniPlayerCanvas = null;
  let miniPlayerContext = null;
  let miniPlayerStream = null;
  let miniPlayerInterval = null;

  function formatAmPm(timeValue) {
    if (!timeValue) return '';
    const [hours, minutes] = timeValue.split(':').map(Number);
    const suffix = hours >= 12 ? 'PM' : 'AM';
    const hour12 = hours % 12 || 12;
    return String(hour12).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ' ' + suffix;
  }

  function currentTimeParts(date) {
    const hours = date.getHours();
    const minutes = date.getMinutes();
    return { value: String(hours % 12 || 12).padStart(2, '0') + ':' + String(minutes).padStart(2, '0'), meridiem: hours >= 12 ? 'PM' : 'AM' };
  }

  function updateFullscreenTask() {
    const input = document.getElementById('taskName');
    const timeInput = document.getElementById('targetTime');
    const nameLabel = document.getElementById('fullscreenTaskName');
    const timeLabel = document.getElementById('fullscreenTargetTime');
    if (nameLabel) nameLabel.textContent = input && input.value.trim() ? input.value.trim().toLocaleUpperCase('pt-BR') : 'CONTADOR';
    if (timeLabel) { const target = timeInput && timeInput.value ? formatAmPm(timeInput.value).split(' ') : []; timeLabel.innerHTML = target.length ? target[0] + '<span class=\"ampm\">' + target[1] + '</span>' : ''; }
    drawMiniPlayerFrame();
  }

  function updateFullscreenButton() {
    const btn = document.getElementById('btnFullscreen');
    const active = document.fullscreenElement || document.webkitFullscreenElement;
    if (btn) btn.textContent = active ? '⛶ SAIR DA TELA CHEIA' : '⛶ TELA CHEIA';
  }

  const DAILY_TASKS_KEY = 'contador-daily-tasks-v1';
  let dailyTasksDate = localDayKey();
  let dailyTaskItems = loadDailyTasks();

  function ensureDailyTasksDate() {
    const today = localDayKey();
    if (today === dailyTasksDate) return false;
    dailyTasksDate = today;
    dailyTaskItems = loadDailyTasks();
    return true;
  }

  function localDayKey(date = new Date()) {
    return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
  }

  function loadDailyTasks() {
    try {
      const stored = JSON.parse(localStorage.getItem(DAILY_TASKS_KEY) || '{}');
      const today = localDayKey();
      const byDate = stored && typeof stored === 'object' && !Array.isArray(stored) ? stored : {};
      const items = Array.isArray(byDate[today]) ? byDate[today] : [];
      return items.filter(item => item && typeof item.name === 'string').map(item => ({ id: String(item.id || ''), name: item.name.trim().slice(0, 100), done: Boolean(item.done) })).filter(item => item.id && item.name).slice(0, 30);
    } catch { return []; }
  }

  function saveDailyTasks() {
    ensureDailyTasksDate();
    try {
      const stored = JSON.parse(localStorage.getItem(DAILY_TASKS_KEY) || '{}');
      const byDate = stored && typeof stored === 'object' && !Array.isArray(stored) ? stored : {};
      byDate[localDayKey()] = dailyTaskItems;
      const keep = Object.keys(byDate).sort().slice(-60);
      localStorage.setItem(DAILY_TASKS_KEY, JSON.stringify(Object.fromEntries(keep.map(key => [key, byDate[key]]))));
    } catch { /* Keep the current list usable for this session if storage is unavailable. */ }
  }

  function renderDailyTasks() {
    ensureDailyTasksDate();
    const list = document.getElementById('dailyTaskList');
    const progress = document.getElementById('dailyTaskProgress');
    if (!list || !progress) return;
    const done = dailyTaskItems.filter(item => item.done).length;
    progress.textContent = `${done}/${dailyTaskItems.length} concluídas`;
    list.innerHTML = dailyTaskItems.length ? dailyTaskItems.map(item => `<div class="daily-task-row${item.done ? ' is-done' : ''}" data-daily-task-id="${escapeHtml(item.id)}"><button type="button" class="daily-task-drag" data-daily-task-drag="${escapeHtml(item.id)}" aria-label="Arrastar para reordenar ${escapeHtml(item.name)}" title="Arraste para reordenar">⠿</button><button type="button" class="daily-task-toggle" data-daily-task-toggle="${escapeHtml(item.id)}" aria-pressed="${item.done}" aria-label="${item.done ? 'Desmarcar' : 'Concluir'} ${escapeHtml(item.name)}">${item.done ? '✓' : ''}</button><span class="daily-task-name">${escapeHtml(item.name)}</span><button type="button" class="daily-task-delete" data-daily-task-delete="${escapeHtml(item.id)}" aria-label="Excluir ${escapeHtml(item.name)}">×</button></div>`).join('') : '<div class="daily-task-empty">Adicione as tarefas que quer concluir antes do fim do contador.</div>';
    drawMiniPlayerFrame();
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
  }

  let activeDailyTaskDrag = null;

  function startDailyTaskReorder(event) {
    const handle = event.target.closest('[data-daily-task-drag]');
    if (!handle || event.button !== undefined && event.button !== 0) return;
    const row = handle.closest('[data-daily-task-id]');
    if (!row) return;
    event.preventDefault();
    activeDailyTaskDrag = { id: row.dataset.dailyTaskId, pointerId: event.pointerId, list: document.getElementById('dailyTaskList'), handle };
    row.classList.add('is-dragging');
    try { handle.setPointerCapture(event.pointerId); } catch {}
  }

  function moveDailyTaskReorder(event) {
    if (!activeDailyTaskDrag || activeDailyTaskDrag.pointerId !== event.pointerId) return;
    event.preventDefault();
    const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('.daily-task-row');
    activeDailyTaskDrag.list.querySelectorAll('.is-drop-target').forEach(node => node.classList.remove('is-drop-target'));
    if (!target || target.dataset.dailyTaskId === activeDailyTaskDrag.id) return;
    target.classList.add('is-drop-target');
    const rect = target.getBoundingClientRect();
    const after = event.clientY > rect.top + rect.height / 2;
    activeDailyTaskDrag.list.insertBefore(activeDailyTaskDrag.list.querySelector(`[data-daily-task-id="${CSS.escape(activeDailyTaskDrag.id)}"]`), after ? target.nextSibling : target);
  }

  function finishDailyTaskReorder(event) {
    if (!activeDailyTaskDrag || activeDailyTaskDrag.pointerId !== event.pointerId) return;
    const { list, id, handle } = activeDailyTaskDrag;
    list.querySelectorAll('.is-dragging,.is-drop-target').forEach(node => node.classList.remove('is-dragging','is-drop-target'));
    try { handle.releasePointerCapture(event.pointerId); } catch {}
    activeDailyTaskDrag = null;
    const order = Array.from(list.querySelectorAll('.daily-task-row')).map(node => node.dataset.dailyTaskId);
    const byId = new Map(dailyTaskItems.map(item => [item.id, item]));
    const reordered = order.map(itemId => byId.get(itemId)).filter(Boolean);
    if (reordered.length === dailyTaskItems.length && reordered.some((item, index) => item.id !== dailyTaskItems[index]?.id)) {
      dailyTaskItems = reordered;
      saveDailyTasks();
      drawMiniPlayerFrame();
    }
  }

  function handleDailyTaskAction(event) {
    const toggle = event.target.closest('[data-daily-task-toggle]');
    const remove = event.target.closest('[data-daily-task-delete]');
    if (!toggle && !remove) return;
    const id = (toggle || remove).dataset.dailyTaskToggle || (toggle || remove).dataset.dailyTaskDelete;
    if (remove) dailyTaskItems = dailyTaskItems.filter(item => item.id !== id);
    else dailyTaskItems = dailyTaskItems.map(item => item.id === id ? { ...item, done: !item.done } : item);
    saveDailyTasks(); renderDailyTasks();
  }

  document.getElementById('dailyTaskForm').addEventListener('submit', event => {
    event.preventDefault();
    const input = document.getElementById('dailyTaskInput');
    const name = input.value.trim().replace(/\\s+/g, ' ').slice(0, 100);
    if (!name || dailyTaskItems.length >= 30) return;
    if (dailyTaskItems.some(item => item.name.toLocaleLowerCase('pt-BR') === name.toLocaleLowerCase('pt-BR'))) { input.value = ''; return; }
    const id = window.crypto?.randomUUID ? window.crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    dailyTaskItems.push({ id, name, done: false }); input.value = ''; saveDailyTasks(); renderDailyTasks(); input.focus();
  });
  const dailyTaskList = document.getElementById('dailyTaskList');
  dailyTaskList.addEventListener('click', handleDailyTaskAction);
  dailyTaskList.addEventListener('pointerdown', startDailyTaskReorder);
  dailyTaskList.addEventListener('pointermove', moveDailyTaskReorder);
  dailyTaskList.addEventListener('pointerup', finishDailyTaskReorder);
  dailyTaskList.addEventListener('pointercancel', finishDailyTaskReorder);
  renderDailyTasks();

  function updateMiniPlayerButton() {
    const button = document.getElementById('btnMiniPlayer');
    if (!button) return;
    const isOpen = !!(miniPlayerVideo && document.pictureInPictureElement === miniPlayerVideo);
    button.textContent = isOpen ? '▣ FECHAR' : '▣ MINI PLAYER';
    button.setAttribute('aria-label', isOpen ? 'Fechar janela PiP' : 'Abrir contador em Picture-in-Picture');
  }

  function drawMiniPlayerFrame() {
    if (!miniPlayerContext || !miniPlayerCanvas) return;
    const context = miniPlayerContext;
    const width = miniPlayerCanvas.width;
    const height = miniPlayerCanvas.height;
    const task = document.getElementById('taskName').value.trim() || 'CONTADOR';
    const timer = document.getElementById('timer').textContent;
    const targetTime = document.getElementById('targetTime').value;
    const expired = document.getElementById('alarmMsg').style.display === 'block';
    const dailyTasks = loadDailyTasks();
    const warning = document.getElementById('barra').classList.contains('warning');
    const overtime = document.getElementById('barra').classList.contains('overtime');

    const background = context.createLinearGradient(0, 0, width, height);
    background.addColorStop(0, '#0b1120');
    background.addColorStop(1, '#111827');
    context.fillStyle = background;
    context.fillRect(0, 0, width, height);
    context.fillStyle = 'rgba(20,30,52,.92)';
    context.fillRect(18, 18, width - 36, height - 36);
    context.lineWidth = 2;
    context.strokeStyle = overtime ? 'rgba(239,68,68,.85)' : warning ? 'rgba(245,158,11,.82)' : 'rgba(56,189,248,.42)';
    context.strokeRect(18, 18, width - 36, height - 36);

    const currentTime = currentTimeParts(new Date());
    const clockLabel = currentTime.value + ' ' + currentTime.meridiem;
    context.font = '800 34px system-ui, sans-serif';
    const clockBoxWidth = Math.ceil(context.measureText(clockLabel).width + 24);
    const clockBoxHeight = 56;
    const clockBoxX = width - 52 - clockBoxWidth;
    const clockBoxY = 42;
    context.fillStyle = 'rgba(250,204,21,.5)';
    context.fillRect(clockBoxX, clockBoxY, clockBoxWidth, clockBoxHeight);
    context.lineWidth = 2;
    context.strokeStyle = 'rgba(250,204,21,.9)';
    context.strokeRect(clockBoxX, clockBoxY, clockBoxWidth, clockBoxHeight);
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    context.font = '900 34px system-ui, sans-serif';
    context.fillStyle = '#0b1120';
    context.fillText(clockLabel, clockBoxX + clockBoxWidth / 2, clockBoxY + clockBoxHeight / 2);
    context.textBaseline = 'alphabetic';

    context.textAlign = 'left';
    context.font = '800 24px system-ui, sans-serif';
    context.fillStyle = '#94a3b8';
    const titleMaxWidth = Math.max(80, clockBoxX - 52 - 16);
    context.fillText(task.toLocaleUpperCase('pt-BR'), 52, 78, titleMaxWidth);

    context.textAlign = 'center';
    context.font = '900 94px system-ui, sans-serif';
    context.fillStyle = overtime ? '#fca5a5' : warning ? '#fde68a' : '#f8fafc';
    context.fillText(timer, width / 2, 202, width - 72);

    context.fillStyle = 'rgba(255,255,255,.15)';
    context.fillRect(52, 244, width - 104, 9);
    const progressWidth = Math.max(0, Math.min(100, parseFloat(document.getElementById('progressBar').style.width) || 0));
    context.fillStyle = 'rgba(56,189,248,.96)';
    context.fillRect(52, 244, (width - 104) * progressWidth / 100, 9);

    context.font = '800 22px system-ui, sans-serif';
    context.fillStyle = expired ? '#fde68a' : '#94a3b8';
    const footer = expired ? 'TEMPO ESGOTADO!' : targetTime ? 'ATÉ ' + formatAmPm(targetTime) : 'CONTADOR REGRESSIVO';
    context.fillText(footer, width / 2, 292, width - 80);

    context.textAlign = 'left';
    context.font = '900 22px system-ui, sans-serif';
    context.fillStyle = '#e2e8f0';
    context.fillText('TAREFAS DO DIA', 52, 326);
    context.textAlign = 'right';
    context.font = '700 18px system-ui, sans-serif';
    context.fillStyle = '#94a3b8';
    context.fillText(`${dailyTasks.filter(item => item.done).length}/${dailyTasks.length}`, width - 52, 326);
    context.textAlign = 'left';
    context.font = '700 22px system-ui, sans-serif';
    context.fillStyle = '#cbd5e1';
    if (!dailyTasks.length) {
      context.fillText('Nenhuma tarefa adicionada', 52, 366, width - 104);
    } else {
      dailyTasks.slice(0, 3).forEach((item, index) => {
        const y = 362 + index * 31;
        context.fillStyle = item.done ? '#86efac' : '#cbd5e1';
        context.fillText(item.done ? '✓' : '○', 54, y);
        context.fillStyle = item.done ? '#94a3b8' : '#e2e8f0';
        const label = item.done ? `${item.name} · FEITA` : item.name;
        context.fillText(label, 84, y, width - 138);
      });
      if (dailyTasks.length > 3) {
        context.font = '700 16px system-ui, sans-serif';
        context.fillStyle = '#94a3b8';
        context.fillText(`+${dailyTasks.length - 3} na lista do dia`, 84, 449, width - 138);
      }
    }
  }

  function prepareMiniPlayerMedia() {
    miniPlayerCanvas = document.createElement('canvas');
    miniPlayerCanvas.width = 640;
    miniPlayerCanvas.height = 470;
    miniPlayerCanvas.setAttribute('aria-hidden', 'true');
    miniPlayerCanvas.style.cssText = 'position:fixed;left:-10000px;top:0;width:640px;height:470px;pointer-events:none;';
    document.body.appendChild(miniPlayerCanvas);
    miniPlayerContext = miniPlayerCanvas.getContext('2d');
    if (!miniPlayerContext) throw new Error('Canvas 2D indisponível');

    drawMiniPlayerFrame();
    miniPlayerStream = miniPlayerCanvas.captureStream(1);
    miniPlayerVideo = document.createElement('video');
    miniPlayerVideo.muted = true;
    miniPlayerVideo.playsInline = true;
    miniPlayerVideo.disablePictureInPicture = false;
    miniPlayerVideo.setAttribute('aria-hidden', 'true');
    miniPlayerVideo.style.cssText = 'position:fixed;left:-10000px;top:0;width:640px;height:470px;opacity:0;pointer-events:none;';
    miniPlayerVideo.srcObject = miniPlayerStream;
    document.body.appendChild(miniPlayerVideo);
    miniPlayerVideo.addEventListener('enterpictureinpicture', () => {
      if (!miniPlayerInterval) miniPlayerInterval = setInterval(drawMiniPlayerFrame, 1000);
      updateMiniPlayerButton();
    });
    miniPlayerVideo.addEventListener('leavepictureinpicture', cleanupMiniPlayer, { once: true });
  }

  function cleanupMiniPlayer() {
    if (miniPlayerInterval) clearInterval(miniPlayerInterval);
    miniPlayerInterval = null;
    if (miniPlayerStream) miniPlayerStream.getTracks().forEach((track) => track.stop());
    if (miniPlayerVideo) {
      miniPlayerVideo.pause();
      miniPlayerVideo.srcObject = null;
      miniPlayerVideo.remove();
    }
    if (miniPlayerCanvas) miniPlayerCanvas.remove();
    miniPlayerVideo = null;
    miniPlayerCanvas = null;
    miniPlayerContext = null;
    miniPlayerStream = null;
    updateMiniPlayerButton();
  }

  async function toggleMiniPlayer() {
    if (!document.pictureInPictureEnabled || !HTMLVideoElement.prototype.requestPictureInPicture || !HTMLCanvasElement.prototype.captureStream) {
      window.alert('Este navegador não oferece o Picture-in-Picture de vídeo necessário para o mini player.');
      return;
    }
    if (document.pictureInPictureElement) {
      if (document.pictureInPictureElement === miniPlayerVideo) await document.exitPictureInPicture();
      else window.alert('Feche o PiP de outro vídeo antes de abrir o contador.');
      return;
    }

    try {
      if (!miniPlayerVideo) prepareMiniPlayerMedia();
      drawMiniPlayerFrame();
      await miniPlayerVideo.play();
      await miniPlayerVideo.requestPictureInPicture();
      drawMiniPlayerFrame();
      if (!miniPlayerInterval) miniPlayerInterval = setInterval(drawMiniPlayerFrame, 1000);
      updateMiniPlayerButton();
    } catch (error) {
      cleanupMiniPlayer();
      console.warn('Não foi possível abrir o PiP nativo.', error);
      window.alert('Não foi possível abrir o PiP. Tente novamente pelo botão do contador.');
    }
  }

  async function toggleFullscreen() {
    const frame = document.getElementById('blockTimer');
    const active = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      if (active) {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else if (frame.requestFullscreen) await frame.requestFullscreen();
      else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
    } catch (error) {
      console.warn('Tela cheia não disponível neste navegador.', error);
    }
    updateFullscreenButton();
  }

  document.getElementById('taskName').addEventListener('input', updateFullscreenTask);
  document.getElementById('targetTime').addEventListener('input', updateFullscreenTask);
  updateFullscreenTask();
  document.addEventListener('fullscreenchange', updateFullscreenButton);
  document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

  function updateClock() {
    const now = new Date();
    const current = currentTimeParts(now); document.getElementById('lineNowValue').textContent = current.value; document.getElementById('lineNowMeridiem').textContent = current.meridiem;
    const wd = now.toLocaleDateString('pt-BR', { weekday: 'long' });
    document.getElementById('lineWeekday').textContent = wd.charAt(0).toUpperCase() + wd.slice(1);
    const d = String(now.getDate()).padStart(2, '0');
    const m = String(now.getMonth() + 1).padStart(2, '0');
    document.getElementById('lineDate').textContent = d + '/' + m;
    document.getElementById('fullscreenLineNowValue').textContent = current.value; document.getElementById('fullscreenLineNowMeridiem').textContent = current.meridiem;
    document.getElementById('fullscreenLineWeekday').textContent = now.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '').toLowerCase();
    document.getElementById('fullscreenLineDate').textContent = d + '/' + m;
  }
  setInterval(updateClock, 1000); updateClock();

  let interval, targetDate;
  let tickAudioContext = null;
  let tickAudioBuffers = Object.create(null);
  let tickSoundStyle = 'classic';
  let tickTockMuted = false;
  const TICK_SOUND_STYLE_KEY = 'contador-tick-style';
  const TICK_SOUND_MUTED_KEY = 'contador-tick-muted';
  const TICK_SOUND_PRESETS = {
    classic: { first: 1900, second: 1450, firstStrength: 0.76, secondStrength: 0.68, gain: 0.22, transient: 0.22, decay: 0.0055, transientDecay: 0.0009, harmonic: 0.16 },
    soft: { first: 1550, second: 1180, firstStrength: 0.62, secondStrength: 0.56, gain: 0.14, transient: 0.10, decay: 0.0048, transientDecay: 0.0008, harmonic: 0.08 },
    wood: { first: 1180, second: 920, firstStrength: 0.82, secondStrength: 0.76, gain: 0.22, transient: 0.36, decay: 0.008, transientDecay: 0.0012, harmonic: 0.24 },
    deep: { first: 850, second: 680, firstStrength: 0.86, secondStrength: 0.80, gain: 0.22, transient: 0.12, decay: 0.009, transientDecay: 0.001, harmonic: 0.12 }
  };
  let tickAudioSource = null;
  let tickAudioGain = null;
  let tickAudioResumePending = false;
  let tickAudioResumeHandler = null;
  const TIMER_STORAGE_KEY = 'contador-active-timer';
  let notificationEnabled = false;
  const NOTIFICATION_TAG = 'contador-ativo';
  let lastNotificationMinute = -1;
  let notificationUpdateInFlight = false;
  const barra = document.getElementById('barra');

  function createTickTockBuffer(context, style) {
    const preset = TICK_SOUND_PRESETS[style] || TICK_SOUND_PRESETS.classic;
    const sampleRate = context.sampleRate;
    const buffer = context.createBuffer(1, sampleRate * 2, sampleRate);
    const samples = buffer.getChannelData(0);
    const clicks = [
      { offset: 0, frequency: preset.first, strength: preset.firstStrength },
      { offset: sampleRate, frequency: preset.second, strength: preset.secondStrength }
    ];
    const clickLength = Math.floor(sampleRate * 0.032);

    clicks.forEach((click) => {
      for (let i = 0; i < clickLength; i++) {
        const elapsed = i / sampleRate;
        const envelope = Math.exp(-elapsed / preset.decay) * (1 - i / clickLength);
        const transient = (Math.random() * 2 - 1) * Math.exp(-elapsed / preset.transientDecay) * preset.transient;
        const tone = Math.sin(2 * Math.PI * click.frequency * elapsed)
          + preset.harmonic * Math.sin(2 * Math.PI * click.frequency * 2.25 * elapsed);
        samples[click.offset + i] = (tone * 0.72 + transient) * envelope * click.strength;
      }
    });
    return buffer;
  }

  function updateTickSoundControls() {
    const selector = document.getElementById('tickSoundStyle');
    const muteButton = document.getElementById('btnTickMute');
    if (selector) selector.value = tickSoundStyle;
    if (muteButton) {
      muteButton.textContent = tickTockMuted ? 'ATIVAR TICK' : 'MUTAR TICK';
      muteButton.setAttribute('aria-pressed', String(tickTockMuted));
      muteButton.setAttribute('aria-label', tickTockMuted ? 'Ativar tique-taque' : 'Mutar tique-taque');
    }
  }

  function loadTickSoundSettings() {
    const savedStyle = localStorage.getItem(TICK_SOUND_STYLE_KEY);
    tickSoundStyle = Object.prototype.hasOwnProperty.call(TICK_SOUND_PRESETS, savedStyle) ? savedStyle : 'classic';
    tickTockMuted = localStorage.getItem(TICK_SOUND_MUTED_KEY) === 'true';
    updateTickSoundControls();
  }

  function changeTickSoundStyle() {
    const selector = document.getElementById('tickSoundStyle');
    if (!selector || !Object.prototype.hasOwnProperty.call(TICK_SOUND_PRESETS, selector.value)) return;
    tickSoundStyle = selector.value;
    localStorage.setItem(TICK_SOUND_STYLE_KEY, tickSoundStyle);
    stopTickTock();
    if (!tickTockMuted && targetDate && targetDate > new Date()) startTickTock(targetDate.getTime() - Date.now());
  }

  function toggleTickMute() {
    tickTockMuted = !tickTockMuted;
    localStorage.setItem(TICK_SOUND_MUTED_KEY, String(tickTockMuted));
    updateTickSoundControls();
    if (tickTockMuted) stopTickTock();
    else if (targetDate && targetDate > new Date()) startTickTock(targetDate.getTime() - Date.now());
  }

  function clearTickTockResume() {
    tickAudioResumePending = false;
    if (tickAudioResumeHandler) {
      document.removeEventListener('pointerdown', tickAudioResumeHandler);
      tickAudioResumeHandler = null;
    }
  }

  function waitForTickTockGesture() {
    tickAudioResumePending = true;
    if (tickAudioResumeHandler) return;
    tickAudioResumeHandler = () => {
      const handler = tickAudioResumeHandler;
      tickAudioResumeHandler = null;
      if (handler) document.removeEventListener('pointerdown', handler);
      if (!tickAudioResumePending) return;
      tickAudioResumePending = false;
      if (!tickTockMuted && targetDate && targetDate > new Date()) startTickTock(targetDate.getTime() - Date.now());
    };
    document.addEventListener('pointerdown', tickAudioResumeHandler, { once: true });
  }

  function startTickTock(remainingMs) {
    if (tickTockMuted || !Number.isFinite(remainingMs) || remainingMs <= 0 || !targetDate || targetDate <= new Date()) return;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;

    try {
      if (!tickAudioContext) tickAudioContext = new AudioContextClass();
      const context = tickAudioContext;
      const startLoop = () => {
        if (!targetDate || targetDate <= new Date()) {
          stopTickTock();
          return;
        }
        if (context.state !== 'running' || tickAudioSource) {
          if (context.state !== 'running') waitForTickTockGesture();
          return;
        }
        clearTickTockResume();
        const selectedStyle = Object.prototype.hasOwnProperty.call(TICK_SOUND_PRESETS, tickSoundStyle) ? tickSoundStyle : 'classic';
        if (!tickAudioBuffers[selectedStyle]) tickAudioBuffers[selectedStyle] = createTickTockBuffer(context, selectedStyle);

        const source = context.createBufferSource();
        const gain = context.createGain();
        source.buffer = tickAudioBuffers[selectedStyle];
        source.loop = true;
        source.loopStart = 0;
        source.loopEnd = tickAudioBuffers[selectedStyle].duration;
        gain.gain.setValueAtTime(TICK_SOUND_PRESETS[selectedStyle].gain, context.currentTime);
        source.connect(gain);
        gain.connect(context.destination);
        source.onended = () => {
          if (tickAudioSource === source) {
            tickAudioSource = null;
            tickAudioGain = null;
          }
        };
        tickAudioSource = source;
        tickAudioGain = gain;
        source.start();
        const secondsRemaining = (targetDate.getTime() - Date.now()) / 1000;
        if (secondsRemaining > 0) source.stop(context.currentTime + secondsRemaining);
        else stopTickTock();
      };

      if (tickAudioContext.state === 'running') startLoop();
      else tickAudioContext.resume().then(startLoop).catch(() => waitForTickTockGesture());
    } catch (error) {
      console.warn('Não foi possível iniciar o tique-taque.', error);
    }
  }

  function stopTickTock() {
    clearTickTockResume();
    if (!tickAudioSource) return;
    const source = tickAudioSource;
    tickAudioSource = null;
    try {
      if (tickAudioGain && tickAudioContext && tickAudioContext.state === 'running') {
        tickAudioGain.gain.cancelScheduledValues(tickAudioContext.currentTime);
        tickAudioGain.gain.setValueAtTime(0, tickAudioContext.currentTime);
      }
      source.stop();
    } catch (error) {}
    tickAudioGain = null;
  }

  async function requestNotificationPermission() {
    if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
    try {
      const permission = Notification.permission === 'default'
        ? await Notification.requestPermission()
        : Notification.permission;
      notificationEnabled = permission === 'granted';
      if (notificationEnabled) updateAndroidNotification('Contador iniciado', true);
    } catch (error) { notificationEnabled = false; }
  }

  async function updateAndroidNotification(text, force = false) {
    if (!notificationEnabled || !targetDate || notificationUpdateInFlight) return;
    const now = Date.now();
    const currentMinute = Math.floor(now / 60000);
    if (!force && currentMinute === lastNotificationMinute) return;
    notificationUpdateInFlight = true;
    try {
      const registration = await navigator.serviceWorker.ready;
      // Alguns navegadores não substituem corretamente uma notificação com a mesma tag.
      // Fecha apenas a versão anterior para publicar a atualização do minuto.
      const previous = await registration.getNotifications({ tag: NOTIFICATION_TAG });
      previous.forEach((notification) => notification.close());
      const taskTitle = document.getElementById('taskName').value.trim();
      const notificationTitle = taskTitle || 'Contador';
      await registration.showNotification(notificationTitle, {
        body: text,
        tag: NOTIFICATION_TAG,
        renotify: false,
        silent: true,
        requireInteraction: true,
        icon: 'icon.svg',
        badge: 'icon.svg'
      });
      lastNotificationMinute = currentMinute;
    } catch (error) { /* navegador pode bloquear atualizacoes em segundo plano */ }
    finally { notificationUpdateInFlight = false; }
  }

  async function closeAndroidNotification() {
    try {
      if (!('serviceWorker' in navigator)) return;
      const registration = await navigator.serviceWorker.ready;
      const notifications = await registration.getNotifications({ tag: NOTIFICATION_TAG });
      notifications.forEach((notification) => notification.close());
    } catch (error) {}
  }

  function startTimer() {
    updateFullscreenTask();
    const val = document.getElementById('targetTime').value;
    if (!val) return;
    const [h, m] = val.split(':').map(Number);
    const now = new Date();
    targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
    if (targetDate <= now) targetDate.setDate(targetDate.getDate() + 1);

    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('btnDone').style.display = 'block';
    saveTimerState();
    startTickTock(targetDate.getTime() - Date.now());
    requestNotificationPermission();
    clearInterval(interval);
    interval = setInterval(tick, 1000); tick();
  }

  function tick(playAlarm = true) {
    const now = new Date();
    const diff = targetDate - now;

    // A barra representa o minuto atual: começa no segundo 0 e termina no 59.
    const secondOfMinute = now.getSeconds() + (now.getMilliseconds() / 1000);
    const pct = Math.min(100, (secondOfMinute / 59) * 100);
    document.getElementById('progressBar').style.width = pct + '%';

    if (diff <= 0) {
      clearInterval(interval);
      stopTickTock();
      document.getElementById('timer').textContent = '00:00:00';
      document.getElementById('alarmMsg').style.display = 'block';
      barra.className = 'overtime';
      drawMiniPlayerFrame();
      if (playAlarm) document.getElementById('alarmSound').play();
      closeAndroidNotification();
      return;
    }

    const mins = diff / 60000;
    barra.className = mins <= 30 ? 'warning' : 'running';

    const hours = Math.floor(diff / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
    const display = hours > 0
      ? String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + seconds
      : String(minutes) + ':' + seconds;
    document.getElementById('timer').textContent = display;
    const totalMinutes = Math.ceil(diff / 60000);
    const noticeHours = Math.floor(totalMinutes / 60);
    const noticeMinutes = totalMinutes % 60;
    const noticeText = noticeHours > 0
      ? 'Restam ' + noticeHours + 'h' + (noticeMinutes ? ' ' + noticeMinutes + 'min' : '')
      : 'Restam ' + (noticeMinutes || 1) + 'min';
    updateAndroidNotification(noticeText);
    drawMiniPlayerFrame();
  }

  function finishTask() { resetTimer(); }

  function resetTimer() {
    clearInterval(interval);
    stopTickTock();
    targetDate = null;
    document.getElementById('alarmSound').pause();
    document.getElementById('timer').textContent = '00:00:00';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('btnStart').style.display = 'block';
    document.getElementById('btnDone').style.display = 'none';
    document.getElementById('alarmMsg').style.display = 'none';
    barra.className = '';
    drawMiniPlayerFrame();
    localStorage.removeItem(TIMER_STORAGE_KEY);
    closeAndroidNotification();
  }

  function saveTimerState() {
    if (!targetDate) return;
    localStorage.setItem(TIMER_STORAGE_KEY, JSON.stringify({
      targetDate: targetDate.getTime(),
      targetTime: document.getElementById('targetTime').value,
      taskName: document.getElementById('taskName').value
    }));
  }

  function restoreTimerState() {
    const saved = localStorage.getItem(TIMER_STORAGE_KEY);
    if (!saved) return;
    try {
      const state = JSON.parse(saved);
      if (!state.targetDate) return;
      targetDate = new Date(state.targetDate);
      document.getElementById('targetTime').value = state.targetTime || '';
      document.getElementById('taskName').value = state.taskName || '';
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnDone').style.display = 'block';
      notificationEnabled = 'Notification' in window && Notification.permission === 'granted';
      tick(false);
      if (targetDate > new Date()) {
        interval = setInterval(() => tick(false), 1000);
        startTickTock(targetDate.getTime() - Date.now());
      }
    } catch (error) {
      localStorage.removeItem(TIMER_STORAGE_KEY);
    }
  }

  document.getElementById('taskName').addEventListener('input', saveTimerState);
  document.getElementById('targetTime').addEventListener('change', saveTimerState);
  document.getElementById('tickSoundStyle').addEventListener('change', changeTickSoundStyle);
  document.getElementById('btnTickMute').addEventListener('click', toggleTickMute);
  loadTickSoundSettings();
  restoreTimerState();
  updateFullscreenTask();

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !targetDate) return;
    if (targetDate <= new Date()) {
      stopTickTock();
      return;
    }
    if (tickAudioSource) stopTickTock();
    startTickTock(targetDate.getTime() - Date.now());
  });

  function refreshPage() {
    // Recarrega sem apagar o cache/PWA, evitando o salto de layout no Galaxy S24.
    const url = new URL(window.location.href);
    url.searchParams.set('v', Date.now().toString());
    window.location.replace(url.pathname + url.search);
  }

  // Registra Service Worker para PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js?v=6').catch(err => console.log('SW error:', err));
    });
  }
</script>
</body>
