<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <!-- auto-refresh a cada 60s para atualizar hora e bateria -->
  <meta http-equiv="refresh" content="60">
  <title>Central — Gio</title>
  <style>
    :root {
      --bg: linear-gradient(135deg, #0d1117 0%, #080b10 100%);
      --text: #f0f0f0;
      --sub: rgba(240,240,240,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100dvh; overflow: hidden; }

    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
    }

    /* ── PORTRAIT: coluna única ───────────────────────── */
    .wrapper {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 18px 14px 12px;
      gap: 12px;
      overflow: hidden;
    }

    /* HEADER pill */
    .header { flex-shrink: 0; }
    .header-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: rgba(176,125,255,0.12);
      border: 1px solid rgba(176,125,255,0.25);
      border-radius: 999px;
    }
    .header-pill h1   { font-size: 1.15rem; font-weight: 900; letter-spacing: -0.4px; }
    .header-pill .sub { font-size: 0.75rem; color: var(--sub); }
    .status-block { margin-left: auto; text-align: right; }
    .status-block .s-time { font-size: 1rem; font-weight: 800; }
    .status-block .s-bat  { font-size: 0.75rem; color: var(--sub); margin-top: 1px; }

    /* GRID portrait: 2 colunas */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
      flex: 1;
      min-height: 0;
    }

    /* CARD */
    .card {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 5px;
      padding: 14px 16px;
      border-radius: 18px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.1s, filter 0.1s;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .card:active { transform: scale(0.95); filter: brightness(1.2); }

    .card[data-c="blue"]   { background: linear-gradient(135deg, rgba(112,184,255,0.2), rgba(112,184,255,0.07)); border: 1px solid rgba(112,184,255,0.35); }
    .card[data-c="purple"] { background: linear-gradient(135deg, rgba(176,125,255,0.2), rgba(176,125,255,0.07)); border: 1px solid rgba(176,125,255,0.35); }
    .card[data-c="teal"]   { background: linear-gradient(135deg, rgba(0,200,180,0.2),   rgba(0,200,180,0.07));   border: 1px solid rgba(0,200,180,0.35);   }
    .card[data-c="red"]    { background: linear-gradient(135deg, rgba(255,80,80,0.2),   rgba(255,80,80,0.07));   border: 1px solid rgba(255,80,80,0.35);   }
    .card[data-c="orange"] { background: linear-gradient(135deg, rgba(255,140,66,0.2),  rgba(255,140,66,0.07));  border: 1px solid rgba(255,140,66,0.35);  }

    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 60%; height: 40%;
      background: rgba(255,255,255,0.045);
      border-radius: 0 0 100% 0;
      pointer-events: none;
    }

    .card-icon { font-size: 2rem; position: relative; z-index: 1; }
    .card-name { font-size: 1.05rem; font-weight: 800; line-height: 1.2; position: relative; z-index: 1; }
    .card-desc { font-size: 0.78rem; color: var(--sub); line-height: 1.3; position: relative; z-index: 1; }

    .card.full { grid-column: span 2; }

    .footer {
      font-size: 0.6rem;
      color: var(--sub);
      opacity: 0.35;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── LANDSCAPE mobile ─────────────────────────────── */
    @media (orientation: landscape) and (max-height: 500px) {
      .wrapper {
        flex-direction: row;
        padding: 10px 12px;
        gap: 10px;
        align-items: stretch;
      }

      /* Barra lateral esquerda */
      .header {
        flex-shrink: 0;
        width: 120px;
        display: flex;
        align-items: stretch;
      }
      .header-pill {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        border-radius: 16px;
        padding: 14px 16px;
        width: 100%;
        gap: 6px;
      }
      .header-pill h1   { font-size: 1.1rem; }
      .header-pill .sub { font-size: 0.7rem; }
      .status-block { margin-left: 0; text-align: left; margin-top: 6px; }
      .status-block .s-time { font-size: 1.3rem; font-weight: 900; }
      .status-block .s-bat  { font-size: 0.72rem; }

      /* Grid: 3 colunas × 2 linhas = 5 cards */
      .grid {
        flex: 1;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: 1fr 1fr;
        gap: 8px;
      }

      .card.full      { grid-column: span 1; }
      .card.full-land { grid-column: span 2; }

      .card { border-radius: 14px; padding: 10px 13px; gap: 4px; }
      .card-icon { font-size: 1.6rem; }
      .card-name { font-size: 0.95rem; }
      .card-desc { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- BARRA LATERAL / HEADER -->
  <div class="header">
    <div class="header-pill">
      <span style="font-size:1.5rem">🔗</span>
      <div>
        <h1>Central</h1>
        <div class="sub">Gio</div>
      </div>
      <!-- Hora + bateria via Battery API (tempo real) -->
      <div class="status-block">
        <div class="s-time" id="s-time">--:--</div>
        <div class="s-bat"  id="s-bat">🔋 --</div>
      </div>
    </div>
  </div>

  <!-- CARDS — 5 links -->
  <div class="grid">

    <a class="card" data-c="teal" href="https://gprdesign.github.io/relogio/" target="_blank">
      <div class="card-icon">🕐</div>
      <div class="card-name">Relógio</div>
      <div class="card-desc">Hora ao vivo</div>
    </a>

    <a class="card" data-c="blue" href="https://gprdesign.github.io/contador/" target="_blank">
      <div class="card-icon">🔢</div>
      <div class="card-name">Contador</div>
      <div class="card-desc">Timer e cliques</div>
    </a>

    <a class="card" data-c="red" href="https://tvacabo.top" target="_blank">
      <div class="card-icon">📡</div>
      <div class="card-name">TV ao Vivo</div>
      <div class="card-desc">tvacabo.top</div>
    </a>

    <a class="card" data-c="purple" href="https://youtube.com/cazetv" target="_blank">
      <div class="card-icon">▶️</div>
      <div class="card-name">CazeTV</div>
      <div class="card-desc">youtube.com/cazetv</div>
    </a>

    <a class="card full full-land" data-c="orange" href="https://site.zapia.com/d6qnya63" target="_blank">
      <div class="card-icon">☀️</div>
      <div class="card-name">/hj — My List</div>
      <div class="card-desc">Tarefas do dia</div>
    </a>

  </div>

  <div class="footer">Gio · Central v2 · atualiza a cada 1min</div>

</div>

<script>
  /* Relógio em tempo real */
  function tick() {
    const n = new Date();
    document.getElementById('s-time').textContent =
      n.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  setInterval(tick, 1000); tick();

  /* Battery API — tempo real quando disponível */
  if (navigator.getBattery) {
    navigator.getBattery().then(function(bat) {
      function updateBat() {
        const pct = Math.round(bat.level * 100);
        const icon = bat.charging ? '⚡' : (pct > 20 ? '🔋' : '🪫');
        document.getElementById('s-bat').textContent = icon + ' ' + pct + '%';
      }
      updateBat();
      bat.addEventListener('levelchange',   updateBat);
      bat.addEventListener('chargingchange', updateBat);
    });
  }
</script>
</body>
</html>
