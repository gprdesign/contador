<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="60">
  <title>Central — Gio</title>
  <style>
    :root {
      --bg: #0d1117;
      --text: #f0f0f0;
      --sub: rgba(240,240,240,0.5);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .wrapper {
      width: 100%; height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: clamp(10px, 3vw, 20px);
      gap: clamp(8px, 2.5vw, 14px);
    }

    /* ── GRID portrait: 2 col × 3 linhas ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: clamp(8px, 2.5vw, 14px);
      flex: 1;
      min-height: 0;
    }

    /* ── CARD base ── */
    .card {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: clamp(5px, 1.5vh, 10px);
      padding: clamp(14px, 4vw, 24px) clamp(14px, 4vw, 24px);
      border-radius: clamp(14px, 4vw, 22px);
      text-decoration: none;
      color: var(--text);
      transition: transform 0.1s, filter 0.1s;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .card:active { transform: scale(0.95); filter: brightness(1.2); }

    .card[data-c="blue"]   { background: linear-gradient(135deg, rgba(112,184,255,0.22), rgba(112,184,255,0.07)); border: 1px solid rgba(112,184,255,0.38); }
    .card[data-c="purple"] { background: linear-gradient(135deg, rgba(176,125,255,0.22), rgba(176,125,255,0.07)); border: 1px solid rgba(176,125,255,0.38); }
    .card[data-c="teal"]   { background: linear-gradient(135deg, rgba(0,200,180,0.22),   rgba(0,200,180,0.07));   border: 1px solid rgba(0,200,180,0.38);   }
    .card[data-c="orange"] { background: linear-gradient(135deg, rgba(255,140,66,0.22),  rgba(255,140,66,0.07));  border: 1px solid rgba(255,140,66,0.38);  }

    /* Card STATUS — span 2 linhas */
    .card[data-c="status"] {
      background: linear-gradient(135deg, rgba(176,125,255,0.22), rgba(112,184,255,0.12));
      border: 1px solid rgba(176,125,255,0.4);
      justify-content: center;
      align-items: flex-start;
      gap: clamp(5px, 1.5vh, 10px);
      grid-row: span 2;
      cursor: pointer;
    }

    .card::after {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 60%; height: 35%;
      background: rgba(255,255,255,0.05);
      border-radius: 0 0 100% 0;
      pointer-events: none;
    }

    /* Portrait mobile: vw generosos, mínimos grandes */
    .card-icon { font-size: clamp(2.2rem, 9vw, 4.5rem); position: relative; z-index: 1; }
    .card-name { font-size: clamp(1.4rem, 5.5vw, 3rem); font-weight: 900; line-height: 1.2; position: relative; z-index: 1; }
    .card-desc { font-size: clamp(1rem, 3.5vw, 1.8rem); color: var(--sub); line-height: 1.3; position: relative; z-index: 1; }

    /* Status — hora 3× card-name: 5.5vw × 3 = ~16vw */
    .status-label { font-size: clamp(0.75rem, 2.8vw, 1.2rem); text-transform: uppercase; letter-spacing: 2px; color: var(--sub); position: relative; z-index: 1; }
    .status-time  { font-size: clamp(4.5rem, 18vw, 10rem); font-weight: 900; letter-spacing: -3px; line-height: 1; position: relative; z-index: 1; }
    .status-bat   { font-size: clamp(1.8rem, 8vw, 4rem); font-weight: 800; color: rgba(255,255,255,0.9); position: relative; z-index: 1; }

    /* Notificações */
    .notif-list  { width: 100%; display: flex; flex-direction: column; gap: 4px; margin-top: 4px; position: relative; z-index: 1; overflow: hidden; max-height: 30%; }
    .notif-item  { display: flex; align-items: flex-start; gap: 5px; background: rgba(255,255,255,0.07); border-radius: 7px; padding: 5px 9px; }
    .notif-app   { font-size: clamp(0.75rem, 2.5vw, 1.1rem); font-weight: 800; color: rgba(255,255,255,0.5); flex-shrink: 0; white-space: nowrap; }
    .notif-text  { font-size: clamp(0.8rem, 2.8vw, 1.2rem); color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .notif-empty { font-size: clamp(0.75rem, 2.5vw, 1rem); color: rgba(255,255,255,0.3); font-style: italic; }

    .footer { font-size: clamp(0.7rem, 2vw, 0.9rem); color: var(--sub); opacity: 0.3; text-align: center; flex-shrink: 0; }

    /* ── LANDSCAPE mobile ── */
    @media (orientation: landscape) and (max-height: 500px) {
      .wrapper {
        flex-direction: row;
        align-items: stretch;
        padding: clamp(6px, 1.5vw, 12px);
        gap: clamp(6px, 1.5vw, 12px);
      }

      .grid {
        flex: 1;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: clamp(6px, 1.5vw, 12px);
      }

      .card[data-c="status"] { grid-row: span 2; grid-column: span 1; }

      /* Landscape: vw é a dimensão GRANDE (~700-900px) — usar vw */
      .card-icon   { font-size: clamp(1.8rem, 5vw,   3.5rem); }
      .card-name   { font-size: clamp(1.2rem, 3.5vw, 2.5rem); }
      .card-desc   { font-size: clamp(0.9rem, 2.5vw, 1.8rem); }

      /* STATUS: hora ~3x card-name: 3.5vw × 3 ≈ 10-11vw */
      .status-time  { font-size: clamp(3.2rem, 11vw, 7rem); letter-spacing: -2px; }
      .status-bat   { font-size: clamp(1.4rem, 4.5vw, 3rem); }
      .status-label { font-size: clamp(0.7rem,  1.8vw, 1.2rem); }
      .notif-app    { font-size: clamp(0.7rem,  1.8vw, 1rem); }
      .notif-text   { font-size: clamp(0.75rem, 2vw,   1.1rem); }
      .notif-empty  { font-size: clamp(0.7rem,  1.8vw, 1rem); }

      .footer { display: none; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="grid">

    <!-- STATUS: hora + bateria — span 2 linhas — clique recarrega -->
    <div class="card" data-c="status" onclick="location.reload()">
      <div class="status-label">agora · toque p/ atualizar</div>
      <div class="status-time" id="s-time">--:--</div>
      <div class="status-bat"  id="s-bat">🔋 --</div>
      <div class="notif-list"  id="notif-list"><div class="notif-empty">carregando…</div></div>
    </div>

    <!-- Col 2 linha 1 -->
    <a class="card" data-c="teal" href="https://gprdesign.github.io/relogio/" target="_blank">
      <div class="card-icon">🕐</div>
      <div class="card-name">Relógio</div>
      <div class="card-desc">Hora ao vivo</div>
    </a>

    <!-- Col 2 linha 2 -->
    <a class="card" data-c="blue" href="https://gprdesign.github.io/contador/" target="_blank">
      <div class="card-icon">⏱️</div>
      <div class="card-name">Contador</div>
      <div class="card-desc">Timer regressivo</div>
    </a>

    <!-- Linha 3 col 1 -->
    <a class="card" data-c="purple" href="https://youtube.com/cazetv" target="_blank">
      <div class="card-icon">▶️</div>
      <div class="card-name">CazeTV</div>
      <div class="card-desc">youtube.com/cazetv</div>
    </a>

    <!-- Linha 3 col 2 -->
    <a class="card" data-c="orange" href="https://site.zapia.com/3bci44hn" target="_blank">
      <div class="card-icon">☀️</div>
      <div class="card-name">/hj</div>
      <div class="card-desc">Tarefas do dia</div>
    </a>

  </div>
  <div class="footer">Central v2 · atualiza a cada 1min</div>
</div>

<script>
  function tick() {
    const n = new Date();
    document.getElementById('s-time').textContent =
      n.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  setInterval(tick, 1000); tick();

  if (navigator.getBattery) {
    navigator.getBattery().then(function(bat) {
      function updateBat() {
        const pct  = Math.round(bat.level * 100);
        const icon = bat.charging ? '⚡' : (pct > 20 ? '🔋' : '🪫');
        document.getElementById('s-bat').textContent = icon + ' ' + pct + '%';
      }
      updateBat();
      bat.addEventListener('levelchange',    updateBat);
      bat.addEventListener('chargingchange', updateBat);
    });
  }

  /* Notificações — lê do Gist a cada 30s */
  const NOTIFS_URL = 'https://gist.githubusercontent.com/gprdesign/42fc7f8c34f1f29a73c48462f6d9c537/raw/notifs.json';
  function loadNotifs() {
    fetch(NOTIFS_URL + '?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        const list   = document.getElementById('notif-list');
        const notifs = (data.notifs || []).slice(0, 4);
        if (!notifs.length) { list.innerHTML = '<div class="notif-empty">sem notificações</div>'; return; }
        list.innerHTML = notifs.map(n =>
          `<div class="notif-item">
            <span class="notif-app">${n.app || '?'}</span>
            <span class="notif-text">${n.title ? n.title + ': ' : ''}${n.text || ''}</span>
          </div>`).join('');
      })
      .catch(() => { document.getElementById('notif-list').innerHTML = '<div class="notif-empty">—</div>'; });
  }
  loadNotifs();
  setInterval(loadNotifs, 30000);
</script>
</body>
</html>
