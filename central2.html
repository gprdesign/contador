<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta http-equiv="refresh" content="60">
  <title>Central — Gio</title>
  <style>
    :root {
      --bg: linear-gradient(135deg, #0d1117 0%, #080b10 100%);
      --text: #f0f0f0;
      --sub: rgba(240,240,240,0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100dvh; overflow: hidden; }
    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
    }

    /* ── PORTRAIT ── */
    .wrapper {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px 12px 10px;
      gap: 10px;
      overflow: hidden;
    }

    /* GRID 2 colunas portrait */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    /* ── CARD base ── */
    .card {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      padding: 16px 18px;
      border-radius: 18px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.1s, filter 0.1s;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .card:active { transform: scale(0.95); filter: brightness(1.2); }

    /* Cores */
    .card[data-c="blue"]   { background: linear-gradient(135deg, rgba(112,184,255,0.22), rgba(112,184,255,0.07)); border: 1px solid rgba(112,184,255,0.38); }
    .card[data-c="purple"] { background: linear-gradient(135deg, rgba(176,125,255,0.22), rgba(176,125,255,0.07)); border: 1px solid rgba(176,125,255,0.38); }
    .card[data-c="teal"]   { background: linear-gradient(135deg, rgba(0,200,180,0.22),   rgba(0,200,180,0.07));   border: 1px solid rgba(0,200,180,0.38);   }
    .card[data-c="red"]    { background: linear-gradient(135deg, rgba(255,80,80,0.22),   rgba(255,80,80,0.07));   border: 1px solid rgba(255,80,80,0.38);   }
    .card[data-c="orange"] { background: linear-gradient(135deg, rgba(255,140,66,0.22),  rgba(255,140,66,0.07));  border: 1px solid rgba(255,140,66,0.38);  }
    /* Card de status: igual ao purple mas sem hover-link */
    .card[data-c="status"] {
      background: linear-gradient(135deg, rgba(176,125,255,0.18), rgba(112,184,255,0.10));
      border: 1px solid rgba(176,125,255,0.35);
      cursor: default;
      justify-content: center;
      gap: 4px;
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 60%; height: 40%;
      background: rgba(255,255,255,0.045);
      border-radius: 0 0 100% 0;
      pointer-events: none;
    }

    .card-icon { font-size: 2.2rem; position: relative; z-index: 1; }
    .card-name { font-size: 1.15rem; font-weight: 900; line-height: 1.2; position: relative; z-index: 1; }
    .card-desc { font-size: 0.82rem; color: var(--sub); line-height: 1.3; position: relative; z-index: 1; }

    /* Card de status — layout especial */
    .status-time {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      position: relative; z-index: 1;
    }
    .status-bat {
      font-size: 1.2rem;
      font-weight: 800;
      color: rgba(255,255,255,0.85);
      position: relative; z-index: 1;
    }
    .status-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--sub);
      position: relative; z-index: 1;
    }

    .card.full { grid-column: span 2; }

    .footer {
      font-size: 0.58rem;
      color: var(--sub);
      opacity: 0.3;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── LANDSCAPE mobile ── */
    @media (orientation: landscape) and (max-height: 500px) {
      .wrapper {
        flex-direction: row;
        padding: 8px 10px;
        gap: 8px;
        align-items: stretch;
      }

      /* Grid: 3 colunas × 2 linhas */
      .grid {
        flex: 1;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: 1fr 1fr;
        gap: 7px;
      }

      .card.full      { grid-column: span 1; }
      .card.full-land { grid-column: span 2; }

      .card { border-radius: 13px; padding: 10px 13px; gap: 4px; }
      .card-icon { font-size: 1.7rem; }
      .card-name { font-size: 1rem; }
      .card-desc { font-size: 0.72rem; }

      .status-time { font-size: 2.2rem; }
      .status-bat  { font-size: 1rem; }

      .footer { display: none; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="grid">

    <!-- CARD STATUS: hora + bateria (ocupa 1 célula, igual aos outros) -->
    <div class="card" data-c="status">
      <div class="status-label">agora</div>
      <div class="status-time" id="s-time">--:--</div>
      <div class="status-bat"  id="s-bat">🔋 --</div>
    </div>

    <a class="card" data-c="teal" href="https://gprdesign.github.io/relogio/" target="_blank">
      <div class="card-icon">🕐</div>
      <div class="card-name">Relógio</div>
      <div class="card-desc">Hora ao vivo</div>
    </a>

    <a class="card" data-c="blue" href="https://gprdesign.github.io/contador/" target="_blank">
      <div class="card-icon">⏱️</div>
      <div class="card-name">Contador</div>
      <div class="card-desc">Timer regressivo</div>
    </a>

    <a class="card" data-c="red" href="https://tvacabo.top" target="_blank">
      <div class="card-icon">📡</div>
      <div class="card-name">TV ao Vivo</div>
      <div class="card-desc">tvacabo.top</div>
    </a>

    <a class="card" data-c="purple" href="https://youtube.com/cazetv" target="_blank">
      <div class="card-icon">▶️</div>
      <div class="card-name">CazeTV</div>
      <div class="card-desc">youtube.com/cazetv</div>
    </a>

    <a class="card full full-land" data-c="orange" href="https://site.zapia.com/d6qnya63" target="_blank">
      <div class="card-icon">☀️</div>
      <div class="card-name">/hj — My List</div>
      <div class="card-desc">Tarefas do dia</div>
    </a>

  </div>

  <div class="footer">Central v2 · atualiza a cada 1min</div>
</div>

<script>
  /* Hora em tempo real */
  function tick() {
    const n = new Date();
    document.getElementById('s-time').textContent =
      n.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  setInterval(tick, 1000); tick();

  /* Battery API */
  if (navigator.getBattery) {
    navigator.getBattery().then(function(bat) {
      function updateBat() {
        const pct  = Math.round(bat.level * 100);
        const icon = bat.charging ? '⚡' : (pct > 20 ? '🔋' : '🪫');
        document.getElementById('s-bat').textContent = icon + ' ' + pct + '%';
      }
      updateBat();
      bat.addEventListener('levelchange',    updateBat);
      bat.addEventListener('chargingchange', updateBat);
    });
  }
</script>
</body>
</html>
